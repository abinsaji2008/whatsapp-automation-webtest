<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evolution API Tester</title>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #fff;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-bottom: 6px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 16px;
      padding: 20px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      margin-top: 15px;
      cursor: pointer;
      font-weight: 600;
    }

    .primary {
      background: #22c55e;
      color: #052e16;
    }

    .danger {
      background: #ef4444;
      color: white;
    }

    .secondary {
      background: #334155;
      color: white;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #334155;
      color: #e2e8f0;
      font-size: 13px;
    }

    .connected {
      background: #14532d;
      color: #bbf7d0;
    }

    .disconnected {
      background: #7f1d1d;
      color: #fecaca;
    }

    #logs {
      height: 420px;
      overflow: auto;
      background: #020617;
      border-radius: 10px;
      padding: 12px;
      font-family: Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .log-line {
      border-bottom: 1px solid #172033;
      padding: 7px 0;
    }

    .small {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 8px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <a href="index.html">Home Page</a>

<div class="container">

  <h1>Evolution API Tester</h1>
  <div class="subtitle">
    REST API + Socket.IO WebSocket event monitor
  </div>

  <div class="grid">

    <!-- CONNECTION -->
    <div class="card">
      <h2>Connection</h2>

      <label>Evolution API URL</label>
      <input
        id="apiUrl"
        placeholder="https://your-evolution.up.railway.app"
      />

      <label>API Key</label>
      <input
        id="apiKey"
        type="password"
        placeholder="Your API key"
      />

      <label>Instance Name</label>
      <input
        id="instance"
        placeholder="myinstance"
      />

      <label>WebSocket Mode</label>
      <select id="wsMode">
        <option value="traditional">Traditional / Instance</option>
        <option value="global">Global</option>
      </select>

      <button class="primary" onclick="checkConnectionState()">
        Check WhatsApp Connection
      </button>

      <button class="primary" onclick="connectSocket()">
        Connect WebSocket
      </button>

      <button class="danger" onclick="disconnectSocket()">
        Disconnect WebSocket
      </button>

      <div id="status" class="status disconnected">
        Not connected
      </div>

      <div class="small">
        WebSocket requires WEBSOCKET_ENABLED=true on Evolution API.
      </div>
    </div>

    <!-- SEND MESSAGE -->
    <div class="card">
      <h2>Send WhatsApp Message</h2>

      <label>Phone Number</label>
      <input
        id="phone"
        placeholder="919876543210"
      />

      <label>Message</label>
      <textarea
        id="message"
        placeholder="Hello from Evolution API!"
      ></textarea>

      <button class="primary" onclick="sendMessage()">
        Send Message
      </button>

      <div id="sendResult" class="small"></div>
    </div>

  </div>

  <div class="card" style="margin-top:20px;">
    <h2>Live Events</h2>

    <button class="secondary" onclick="clearLogs()">
      Clear Logs
    </button>

    <div id="logs"></div>
  </div>

</div>

<script>

let socket = null;

function getConfig() {
  return {
    apiUrl: document.getElementById("apiUrl").value.trim().replace(/\/+$/, ""),
    apiKey: document.getElementById("apiKey").value.trim(),
    instance: document.getElementById("instance").value.trim(),
    mode: document.getElementById("wsMode").value
  };
}

function log(title, data = "") {
  const logs = document.getElementById("logs");

  const time = new Date().toLocaleTimeString();

  let output = data;

  if (typeof data === "object") {
    output = JSON.stringify(data, null, 2);
  }

  logs.innerHTML += `
    <div class="log-line">
      <b>[${time}] ${escapeHtml(title)}</b>
      <pre>${escapeHtml(output)}</pre>
    </div>
  `;

  logs.scrollTop = logs.scrollHeight;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function setStatus(text, connected = false) {
  const el = document.getElementById("status");

  el.textContent = text;

  el.className =
    "status " + (connected ? "connected" : "disconnected");
}

/* ---------------------------------------
   CHECK INSTANCE CONNECTION
---------------------------------------- */

async function checkConnectionState() {

  const { apiUrl, apiKey, instance } = getConfig();

  if (!apiUrl || !apiKey || !instance) {
    alert("Enter API URL, API key and instance name.");
    return;
  }

  try {

    log("Checking instance connection...");

    const response = await fetch(
      `${apiUrl}/instance/connectionState/${encodeURIComponent(instance)}`,
      {
        method: "GET",
        headers: {
          "apikey": apiKey
        }
      }
    );

    const data = await response.json();

    log("Connection State Response", data);

    const state =
      data?.instance?.state ||
      data?.state ||
      data?.status ||
      "unknown";

    if (String(state).toLowerCase() === "open") {
      setStatus("WhatsApp Connected", true);
    } else {
      setStatus("WhatsApp: " + state, false);
    }

  } catch (error) {

    log("Connection State Error", error.message);

    setStatus("API Error", false);
  }
}


/* ---------------------------------------
   SOCKET.IO CONNECTION
---------------------------------------- */

function connectSocket() {

  const { apiUrl, apiKey, instance, mode } = getConfig();

  if (!apiUrl || !apiKey) {
    alert("Enter API URL and API key.");
    return;
  }

  if (socket) {
    socket.disconnect();
    socket = null;
  }

  let socketUrl;

  if (mode === "global") {

    socketUrl = apiUrl;

  } else {

    if (!instance) {
      alert("Enter instance name.");
      return;
    }

    socketUrl =
      `${apiUrl}/${encodeURIComponent(instance)}`;
  }

  log("Connecting WebSocket", socketUrl);

  socket = io(socketUrl, {
    transports: ["websocket"],
    extraHeaders: {
      apikey: apiKey
    }
  });

  socket.on("connect", () => {

    setStatus("WebSocket Connected", true);

    log("WebSocket Connected", {
      id: socket.id,
      url: socketUrl
    });
  });

  socket.on("disconnect", (reason) => {

    setStatus("WebSocket Disconnected", false);

    log("WebSocket Disconnected", reason);
  });

  socket.on("connect_error", (error) => {

    setStatus("WebSocket Error", false);

    log("WebSocket Connection Error", {
      message: error.message,
      description: error.description,
      context: error.context
    });
  });


  /* Common Evolution API events */

  const events = [

    "application.startup",

    "instance.create",
    "instance.delete",

    "qrcode.updated",

    "connection.update",
    "status.instance",

    "messages.set",
    "messages.upsert",
    "messages.edited",
    "messages.update",
    "messages.delete",

    "send.message",
    "send.message.update",

    "contacts.set",
    "contacts.upsert",
    "contacts.update",

    "presence.update",

    "chats.set",
    "chats.upsert",
    "chats.update",
    "chats.delete",

    "groups.upsert",
    "group.update",
    "group.participants.update",

    "labels.edit",
    "labels.association",

    "call"
  ];


  events.forEach(eventName => {

    socket.on(eventName, data => {

      log(eventName, data);

    });

  });


  /*
     Catch-all listener.

     This is useful when your Evolution API version
     sends an event that isn't included above.
  */

  socket.onAny((event, ...args) => {

    if (!events.includes(event)) {

      log("EVENT: " + event, args);

    }

  });

}


/* ---------------------------------------
   DISCONNECT
---------------------------------------- */

function disconnectSocket() {

  if (!socket) {
    return;
  }

  socket.disconnect();

  socket = null;

  setStatus("Disconnected", false);

  log("WebSocket manually disconnected");
}


/* ---------------------------------------
   SEND MESSAGE
---------------------------------------- */

async function sendMessage() {

  const { apiUrl, apiKey, instance } = getConfig();

  const phone =
    document.getElementById("phone").value.trim();

  const message =
    document.getElementById("message").value;

  const result =
    document.getElementById("sendResult");

  if (!apiUrl || !apiKey || !instance) {
    alert("Enter API URL, API key and instance.");
    return;
  }

  if (!phone) {
    alert("Enter phone number.");
    return;
  }

  if (!message) {
    alert("Enter message.");
    return;
  }

  result.textContent = "Sending...";

  try {

    const response = await fetch(
      `${apiUrl}/message/sendText/${encodeURIComponent(instance)}`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": apiKey
        },

        body: JSON.stringify({
          number: phone,
          text: message
        })
      }
    );

    const data = await response.json();

    log("Send Message Response", data);

    if (response.ok) {

      result.textContent =
        "Message sent successfully.";

    } else {

      result.textContent =
        "Error: " + (data?.message || "Request failed");

    }

  } catch (error) {

    result.textContent =
      "Request error: " + error.message;

    log("Send Message Error", error.message);

  }
}


/* ---------------------------------------
   CLEAR LOGS
---------------------------------------- */

function clearLogs() {

  document.getElementById("logs").innerHTML = "";


}


</script>

</body>
</html>
