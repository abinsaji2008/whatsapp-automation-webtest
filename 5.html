<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Evolution API WhatsApp Chat</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#111b21;
    color:#e9edef;
    font-family:Arial,sans-serif;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* TOP */

.top{
    background:#202c33;
    padding:12px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.top input{
    background:#2a3942;
    color:white;
    border:1px solid #3b4a54;
    border-radius:6px;
    padding:10px;
    outline:none;
}

.url{
    flex:2;
    min-width:220px;
}

.instance{
    flex:1;
    min-width:120px;
}

.phone{
    flex:1;
    min-width:150px;
}

.key{
    flex:2;
    min-width:180px;
}

button{
    border:0;
    border-radius:6px;
    padding:10px 16px;
    background:#00a884;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#008f72;
}

/* INFO */

.info{
    background:#182229;
    padding:8px 15px;
    font-size:13px;
    color:#aebac1;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.loading{
    text-align:center;
    padding:12px;
    color:#8696a0;
    display:none;
}

.error{
    background:#4b2020;
    color:#ffb3b3;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
    display:none;
    white-space:pre-wrap;
}

.end{
    text-align:center;
    color:#667781;
    font-size:12px;
    padding:15px;
}

/* MESSAGE */

.message{
    display:flex;
    margin:5px 0;
}

.message.in{
    justify-content:flex-start;
}

.message.out{
    justify-content:flex-end;
}

.bubble{
    max-width:70%;
    padding:8px 10px;
    border-radius:8px;
    word-break:break-word;
}

.in .bubble{
    background:#202c33;
}

.out .bubble{
    background:#005c4b;
}

.text{
    white-space:pre-wrap;
}

.time{
    font-size:10px;
    color:#aebac1;
    text-align:right;
    margin-top:4px;
}

/* BOTTOM */

.bottom{
    display:flex;
    gap:8px;
    padding:10px;
    background:#202c33;
}

.messageInput{
    flex:1;
    background:#2a3942;
    color:white;
    border:0;
    border-radius:8px;
    padding:13px;
    outline:none;
}
</style>
</head>

<body>

<div class="app">

    <!-- SETTINGS -->

    <div class="top">

        <input
            id="apiUrl"
            class="url"
            placeholder="Evolution API URL"
            value="https://YOUR-RAILWAY-URL"
        >

        <input
            id="instance"
            class="instance"
            placeholder="Instance"
            value="YOUR_INSTANCE"
        >

        <input
            id="phone"
            class="phone"
            placeholder="Phone: 919876543210"
        >

        <input
            id="apiKey"
            class="key"
            type="password"
            placeholder="API Key"
        >

        <button onclick="connect()">
            Load Chat
        </button>

    </div>

    <div class="info" id="info">
        Not connected
    </div>

    <!-- CHAT -->

    <div id="chat" class="chat">

        <div id="error" class="error"></div>

        <div id="loading" class="loading">
            Loading messages...
        </div>

        <div id="messages"></div>

        <div id="end" class="end"></div>

    </div>

    <!-- SEND -->

    <div class="bottom">

        <input
            id="messageInput"
            class="messageInput"
            placeholder="Type message..."
            onkeydown="enterSend(event)"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

/* =========================================================
   VARIABLES
========================================================= */

let API_URL = "";
let API_KEY = "";
let INSTANCE = "";
let PHONE = "";

let page = 1;
const limit = 30;

let loading = false;
let hasMore = true;

let messageIds = new Set();


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById("chat");

const messages =
    document.getElementById("messages");

const loadingElement =
    document.getElementById("loading");

const errorElement =
    document.getElementById("error");

const endElement =
    document.getElementById("end");

const infoElement =
    document.getElementById("info");


/* =========================================================
   CONNECT
========================================================= */

async function connect(){

    API_URL =
        document
        .getElementById("apiUrl")
        .value
        .trim()
        .replace(/\/$/,"");

    API_KEY =
        document
        .getElementById("apiKey")
        .value
        .trim();

    INSTANCE =
        document
        .getElementById("instance")
        .value
        .trim();

    PHONE =
        document
        .getElementById("phone")
        .value
        .trim()
        .replace(/\D/g,"");


    if(!API_URL){
        showError("Evolution API URL is missing.");
        return;
    }

    if(!API_KEY){
        showError("API key is missing.");
        return;
    }

    if(!INSTANCE){
        showError("Instance name is missing.");
        return;
    }

    if(!PHONE){
        showError("Phone number is missing.");
        return;
    }


    page = 1;
    hasMore = true;

    messageIds.clear();

    messages.innerHTML = "";

    endElement.innerText = "";

    infoElement.innerText =
        "Loading chat for +" + PHONE;


    await loadMessages(true);
}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    endpoint,
    method = "GET",
    body = null
){

    const options = {

        method,

        headers:{
            "Content-Type":
                "application/json",

            "apikey":
                API_KEY
        }

    };


    if(body !== null){

        options.body =
            JSON.stringify(body);

    }


    const response =
        await fetch(
            API_URL + endpoint,
            options
        );


    const text =
        await response.text();


    let data;

    try{

        data =
            text
                ? JSON.parse(text)
                : {};

    }
    catch{

        data = text;

    }


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status +
            "\n\n" +
            (
                typeof data === "string"
                    ? data
                    : JSON.stringify(
                        data,
                        null,
                        2
                    )
            )
        );

    }


    return data;
}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(initial=false){

    if(loading || !hasMore){
        return;
    }


    loading = true;

    loadingElement.style.display =
        "block";

    errorElement.style.display =
        "none";


    /*
       Save scroll position.

       Required when inserting old
       messages above existing ones.
    */

    const oldHeight =
        chat.scrollHeight;

    const oldTop =
        chat.scrollTop;


    try{

        const jid =
            PHONE +
            "@s.whatsapp.net";


        /*
          Evolution API history request.

          This is the endpoint used by
          many Evolution API versions.

          If your version returns an error,
          the page will now display the
          exact API response.
        */

        const body = {

            where:{

                key:{

                    remoteJid:jid

                }

            },

            page:page,

            limit:limit

        };


        console.log(
            "REQUEST:",
            API_URL +
            "/chat/findMessages/" +
            INSTANCE
        );

        console.log(
            "BODY:",
            body
        );


        const data =
            await apiRequest(

                "/chat/findMessages/" +
                encodeURIComponent(
                    INSTANCE
                ),

                "POST",

                body

            );


        console.log(
            "EVOLUTION RESPONSE:",
            data
        );


        const list =
            extractMessages(data);


        if(!list.length){

            hasMore = false;

            endElement.innerText =
                "No more messages";

            infoElement.innerText =
                "No messages found for +" +
                PHONE;

            return;
        }


        /*
          Remove duplicates.
        */

        const unique =
            list.filter(
                msg => {

                    const id =
                        getId(msg);

                    if(
                        messageIds.has(id)
                    ){
                        return false;
                    }

                    messageIds.add(id);

                    return true;

                }
            );


        /*
          Sort old → new.
        */

        unique.sort(
            (a,b)=>
                getTimestamp(a) -
                getTimestamp(b)
        );


        /*
          Initial = add normally.

          Older = add at top.
        */

        if(initial){

            unique.forEach(
                addMessage
            );

        }
        else{

            unique
                .reverse()
                .forEach(
                    addMessageTop
                );

        }


        /*
          Pagination.

          If fewer than requested were
          returned, assume we're at the
          beginning.
        */

        if(
            list.length < limit
        ){

            hasMore = false;

            endElement.innerText =
                "Beginning of conversation";

        }
        else{

            page++;

        }


        /*
          Preserve scroll position
          when loading older messages.
        */

        if(!initial){

            const newHeight =
                chat.scrollHeight;

            chat.scrollTop =
                oldTop +
                (
                    newHeight -
                    oldHeight
                );

        }
        else{

            /*
              Start at bottom.
            */

            setTimeout(
                () => {

                    chat.scrollTop =
                        chat.scrollHeight;

                },
                50
            );

        }


        infoElement.innerText =
            "Loaded " +
            messageIds.size +
            " messages";


    }
    catch(error){

        console.error(error);

        showError(
            "FAILED TO LOAD MESSAGES\n\n" +
            error.message
        );

    }
    finally{

        loading = false;

        loadingElement.style.display =
            "none";

    }

}


/* =========================================================
   EXTRACT MESSAGES
========================================================= */

function extractMessages(data){

    /*
      Different Evolution API versions
      can return different structures.
    */

    if(Array.isArray(data)){
        return data;
    }


    if(
        data &&
        Array.isArray(
            data.messages
        )
    ){
        return data.messages;
    }


    if(
        data &&
        Array.isArray(
            data.response
        )
    ){
        return data.response;
    }


    if(
        data &&
        data.response &&
        Array.isArray(
            data.response.messages
        )
    ){
        return data.response.messages;
    }


    if(
        data &&
        data.data &&
        Array.isArray(
            data.data
        )
    ){
        return data.data;
    }


    if(
        data &&
        data.data &&
        Array.isArray(
            data.data.messages
        )
    ){
        return data.data.messages;
    }


    return [];

}


/* =========================================================
   SCROLL UP
========================================================= */

chat.addEventListener(
    "scroll",
    () => {

        if(
            chat.scrollTop <= 120 &&
            !loading &&
            hasMore
        ){

            loadMessages(false);

        }

    }
);


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(msg){

    const id =
        getId(msg);


    if(
        messageIds.has(
            "rendered-" + id
        )
    ){
        return;
    }


    messageIds.add(
        "rendered-" + id
    );


    const element =
        createMessage(msg);


    messages.appendChild(
        element
    );

}


/* =========================================================
   ADD MESSAGE TOP
========================================================= */

function addMessageTop(msg){

    const id =
        getId(msg);


    const element =
        createMessage(msg);


    messages.prepend(
        element
    );

}


/* =========================================================
   CREATE MESSAGE
========================================================= */

function createMessage(msg){

    const fromMe =
        !!(
            msg.key &&
            msg.key.fromMe
        );


    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        (
            fromMe
                ? "out"
                : "in"
        );


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    const text =
        document.createElement(
            "div"
        );

    text.className =
        "text";

    text.innerText =
        getText(msg);


    const time =
        document.createElement(
            "div"
        );

    time.className =
        "time";

    time.innerText =
        formatTime(
            getTimestamp(msg)
        );


    bubble.appendChild(
        text
    );

    bubble.appendChild(
        time
    );

    wrapper.appendChild(
        bubble
    );


    return wrapper;

}


/* =========================================================
   GET TEXT
========================================================= */

function getText(msg){

    const m =
        msg.message ||
        {};


    if(
        typeof m.conversation ===
        "string"
    ){

        return m.conversation;

    }


    if(
        m.extendedTextMessage
    ){

        return (
            m
            .extendedTextMessage
            .text ||
            ""
        );

    }


    if(
        m.imageMessage
    ){

        return (
            "📷 " +
            (
                m
                .imageMessage
                .caption ||
                "Image"
            )
        );

    }


    if(
        m.videoMessage
    ){

        return (
            "🎥 " +
            (
                m
                .videoMessage
                .caption ||
                "Video"
            )
        );

    }


    if(
        m.audioMessage
    ){

        return "🎵 Audio";

    }


    if(
        m.documentMessage
    ){

        return (
            "📄 " +
            (
                m
                .documentMessage
                .fileName ||
                "Document"
            )
        );

    }


    return (
        msg.messageType ||
        "Unsupported message"
    );

}


/* =========================================================
   ID
========================================================= */

function getId(msg){

    return (
        msg.key &&
        msg.key.id
    ) ||
    msg.id ||
    (
        "generated-" +
        Math.random()
    );

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestamp(msg){

    let t =
        msg.messageTimestamp ||
        msg.timestamp ||
        0;


    if(
        typeof t === "object"
    ){

        t =
            t.low ||
            t.seconds ||
            0;

    }


    if(
        t > 100000000000
    ){

        return t;

    }


    return t * 1000;

}


/* =========================================================
   TIME
========================================================= */

function formatTime(t){

    if(!t){
        return "";
    }


    return new Date(t)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

    const input =
        document
        .getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text){
        return;
    }


    try{

        await apiRequest(

            "/message/sendText/" +
            encodeURIComponent(
                INSTANCE
            ),

            "POST",

            {
                number:PHONE,
                text:text
            }

        );


        input.value = "";

        infoElement.innerText =
            "Message sent";


    }
    catch(error){

        showError(
            "SEND FAILED\n\n" +
            error.message
        );

    }

}


/* =========================================================
   ENTER
========================================================= */

function enterSend(event){

    if(
        event.key === "Enter"
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================================
   ERROR
========================================================= */

function showError(text){

    errorElement.innerText =
        text;

    errorElement.style.display =
        "block";

    infoElement.innerText =
        "Error";

}

</script>

</body>
</html>
