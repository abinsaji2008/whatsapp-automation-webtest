<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Evolution WhatsApp Chat</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111b21;
    color: #e9edef;
}

body {
    overflow: hidden;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    height: 64px;
    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 8px 15px;

    gap: 12px;

    background: #202c33;
}

.avatar {
    width: 45px;
    height: 45px;

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #00a884;

    color: white;

    font-weight: bold;
}

.headerInfo {
    min-width: 0;
    flex: 1;
}

.headerTitle {
    font-size: 17px;
    font-weight: bold;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.headerSub {
    margin-top: 3px;

    font-size: 12px;

    color: #8696a0;
}


/* =========================================================
   SETTINGS
========================================================= */

.settings {
    flex-shrink: 0;

    background: #182229;

    padding: 10px;

    display: grid;

    grid-template-columns:
        2fr
        1fr
        1.2fr
        1.5fr
        100px;

    gap: 7px;
}

.settings input {
    width: 100%;

    padding: 10px;

    border-radius: 6px;

    border: 1px solid #3b4a54;

    outline: none;

    background: #2a3942;

    color: white;
}

.settings input:focus {
    border-color: #00a884;
}

button {
    border: 0;

    border-radius: 6px;

    padding: 10px;

    background: #00a884;

    color: white;

    cursor: pointer;

    font-weight: bold;
}

button:hover {
    background: #008f72;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}


/* =========================================================
   STATUS
========================================================= */

.status {
    flex-shrink: 0;

    background: #182229;

    padding: 7px 12px;

    color: #aebac1;

    font-size: 12px;
}


/* =========================================================
   ERROR
========================================================= */

.error {
    display: none;

    flex-shrink: 0;

    margin: 8px;

    padding: 10px;

    border-radius: 6px;

    background: #4b2020;

    color: #ffb4b4;

    white-space: pre-wrap;

    font-family: monospace;

    font-size: 12px;

    max-height: 180px;

    overflow: auto;
}


/* =========================================================
   CHAT
========================================================= */

.chat {
    flex: 1;

    min-height: 0;

    width: 100%;

    overflow-y: auto;

    overflow-x: hidden;

    padding: 15px;

    background: #0b141a;

    scroll-behavior: auto;
}


/* =========================================================
   LOADING
========================================================= */

.loading {
    display: none;

    text-align: center;

    padding: 10px;

    color: #8696a0;

    font-size: 13px;
}


/* =========================================================
   END
========================================================= */

.end {
    text-align: center;

    padding: 15px;

    color: #667781;

    font-size: 12px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {
    display: flex;

    width: 100%;

    margin: 4px 0;
}

.message.incoming {
    justify-content: flex-start;
}

.message.outgoing {
    justify-content: flex-end;
}

.bubble {
    max-width: 70%;

    padding: 8px 10px;

    border-radius: 8px;

    word-break: break-word;
}

.incoming .bubble {
    background: #202c33;
}

.outgoing .bubble {
    background: #005c4b;
}

.text {
    white-space: pre-wrap;

    font-size: 15px;

    line-height: 1.4;
}

.time {
    margin-top: 4px;

    text-align: right;

    font-size: 10px;

    color: #aebac1;
}


/* =========================================================
   MEDIA
========================================================= */

.media {
    display: block;

    max-width: 300px;

    max-height: 300px;

    border-radius: 8px;
}


/* =========================================================
   BOTTOM
========================================================= */

.bottom {
    flex-shrink: 0;

    display: flex;

    gap: 8px;

    padding: 10px;

    background: #202c33;
}

.bottom input {
    flex: 1;

    min-width: 0;

    padding: 13px;

    border: 0;

    outline: none;

    border-radius: 8px;

    background: #2a3942;

    color: white;
}

.send {
    width: 80px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 800px) {

    .settings {
        grid-template-columns:
            1fr
            1fr;
    }

    .settings button {
        grid-column: span 2;
    }

    .bubble {
        max-width: 85%;
    }
}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="avatar">
        WA
    </div>

    <div class="headerInfo">

        <div
            id="headerTitle"
            class="headerTitle"
        >
            WhatsApp Chat
        </div>

        <div
            id="headerSub"
            class="headerSub"
        >
            Not connected
        </div>

    </div>

</div>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div class="settings">

    <input
        id="apiUrl"
        placeholder="Evolution API URL"
        value="https://YOUR-RAILWAY-APP.up.railway.app"
    >

    <input
        id="instance"
        placeholder="Instance name"
    >

    <input
        id="phone"
        placeholder="Phone number"
        value="918086999662"
    >

    <input
        id="apiKey"
        type="password"
        placeholder="Evolution API Key"
    >

    <button
        id="connectButton"
        onclick="connect()"
    >
        Connect
    </button>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div
    id="status"
    class="status"
>
    Not connected
</div>


<!-- =====================================================
     ERROR
===================================================== -->

<div
    id="error"
    class="error"
></div>


<!-- =====================================================
     CHAT
===================================================== -->

<div
    id="chat"
    class="chat"
>

    <div
        id="loading"
        class="loading"
    >
        Loading...
    </div>

    <div
        id="messages"
    ></div>

    <div
        id="end"
        class="end"
    ></div>

</div>


<!-- =====================================================
     MESSAGE INPUT
===================================================== -->

<div class="bottom">

    <input
        id="messageInput"
        placeholder="Type a message..."
        onkeydown="handleEnter(event)"
    >

    <button
        id="sendButton"
        class="send"
        onclick="sendMessage()"
    >
        Send
    </button>

</div>


</div>


<script>

/* =========================================================
   VARIABLES
========================================================= */

let API_URL = "";

let API_KEY = "";

let INSTANCE = "";

let PHONE = "";


/*
 * Your API response contains:
 *
 * messages.total
 * messages.pages
 * messages.currentPage
 * messages.records
 */

const PAGE_SIZE = 50;


let currentPage = 0;

let totalPages = 1;


let loading = false;

let connected = false;


/*
 * All matching conversation messages.
 */

let conversationMessages = [];


/*
 * Prevent duplicate messages.
 */

const messageIds = new Set();


/*
 * Used to prevent multiple
 * automatic initial loads.
 */

let initialLoading = false;


/* =========================================================
   DOM
========================================================= */

const chat =
    document.getElementById(
        "chat"
    );

const messagesContainer =
    document.getElementById(
        "messages"
    );

const loadingElement =
    document.getElementById(
        "loading"
    );

const errorElement =
    document.getElementById(
        "error"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const endElement =
    document.getElementById(
        "end"
    );

const connectButton =
    document.getElementById(
        "connectButton"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );


/* =========================================================
   CONNECT
========================================================= */

async function connect() {

    clearError();


    API_URL =
        document
        .getElementById(
            "apiUrl"
        )
        .value
        .trim()
        .replace(
            /\/$/,
            ""
        );


    API_KEY =
        document
        .getElementById(
            "apiKey"
        )
        .value
        .trim();


    INSTANCE =
        document
        .getElementById(
            "instance"
        )
        .value
        .trim();


    PHONE =
        document
        .getElementById(
            "phone"
        )
        .value
        .trim()
        .replace(
            /\D/g,
            ""
        );


    /* -----------------------------------------------------
       VALIDATION
    ----------------------------------------------------- */

    if (!API_URL) {

        showError(
            "Evolution API URL is required."
        );

        return;

    }


    if (!API_KEY) {

        showError(
            "Evolution API Key is required."
        );

        return;

    }


    if (!INSTANCE) {

        showError(
            "Instance name is required."
        );

        return;

    }


    if (!PHONE) {

        showError(
            "Phone number is required."
        );

        return;

    }


    /* -----------------------------------------------------
       RESET
    ----------------------------------------------------- */

    conversationMessages = [];

    messageIds.clear();

    currentPage = 0;

    totalPages = 1;

    messagesContainer.innerHTML = "";

    endElement.innerText = "";

    connected = false;


    document
        .getElementById(
            "headerTitle"
        )
        .innerText =
        "+" + PHONE;


    document
        .getElementById(
            "headerSub"
        )
        .innerText =
        "Connecting...";


    connectButton.disabled =
        true;


    try {

        await loadInitialConversation();


        connected = true;


        document
            .getElementById(
                "headerSub"
            )
            .innerText =
            "Connected";


        setStatus(
            "Connected • " +
            conversationMessages.length +
            " messages"
        );


    }
    catch (error) {

        showError(
            error.message
        );


        document
            .getElementById(
                "headerSub"
            )
            .innerText =
            "Connection failed";

    }
    finally {

        connectButton.disabled =
            false;

    }

}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    endpoint,
    method = "GET",
    body = null
) {

    const options = {

        method: method,

        headers: {

            "Content-Type":
                "application/json",

            "apikey":
                API_KEY

        }

    };


    if (body !== null) {

        options.body =
            JSON.stringify(
                body
            );

    }


    console.log(
        "REQUEST:",
        API_URL + endpoint
    );


    console.log(
        "BODY:",
        body
    );


    let response;


    try {

        response =
            await fetch(
                API_URL + endpoint,
                options
            );

    }
    catch (error) {

        throw new Error(

            "Failed to fetch Evolution API.\n\n" +

            API_URL + endpoint +

            "\n\n" +

            "Check your Railway URL and CORS."

        );

    }


    const text =
        await response.text();


    let data;


    try {

        data =
            text
                ? JSON.parse(text)
                : {};

    }
    catch {

        data = text;

    }


    console.log(
        "HTTP:",
        response.status
    );


    console.log(
        "RESPONSE:",
        data
    );


    if (!response.ok) {

        throw new Error(

            "Evolution API HTTP " +
            response.status +
            "\n\n" +

            (
                typeof data ===
                "string"

                    ? data

                    : JSON.stringify(
                        data,
                        null,
                        2
                    )

            )

        );

    }


    return data;

}


/* =========================================================
   INITIAL CONVERSATION
========================================================= */

async function loadInitialConversation() {

    initialLoading = true;

    loading = false;


    loadingElement.style.display =
        "block";


    setStatus(
        "Searching conversation..."
    );


    /*
     * Start from API page 1.
     *
     * We will continue loading pages
     * until enough messages exist to
     * create a scrollbar.
     */

    let page = 1;

    let safety = 0;


    try {

        while (
            safety < 30
        ) {

            safety++;


            /*
             * Fetch one API page.
             */

            const result =
                await fetchPage(
                    page
                );


            currentPage =
                page;


            totalPages =
                result.totalPages;


            /*
             * Add matching messages.
             */

            addMessages(
                result.matches
            );


            /*
             * Sort.
             */

            sortMessages();


            /*
             * Render.
             */

            renderMessages();


            /*
             * Wait for browser to
             * calculate scrollHeight.
             */

            await nextFrame();


            setStatus(

                "Searching page " +
                page +
                " / " +
                totalPages +

                " • " +

                conversationMessages.length +
                " messages"

            );


            /*
             * IMPORTANT:
             *
             * If the chat is now actually
             * scrollable, stop.
             */

            const scrollable =

                chat.scrollHeight >
                chat.clientHeight + 50;


            if (
                scrollable &&
                conversationMessages.length >= 10
            ) {

                break;

            }


            /*
             * No more pages.
             */

            if (
                page >=
                totalPages
            ) {

                break;

            }


            page++;

        }


        /*
         * If messages exist, put user
         * at the newest message.
         */

        if (
            conversationMessages.length
        ) {

            await nextFrame();


            chat.scrollTop =
                chat.scrollHeight;


            setStatus(

                "Loaded " +
                conversationMessages.length +
                " messages • scroll up for older"

            );

        }
        else {

            endElement.innerText =
                "No messages found for +" +
                PHONE;

            setStatus(
                "No messages found"
            );

        }

    }
    finally {

        initialLoading = false;

        loading = false;

        loadingElement.style.display =
            "none";

    }

}


/* =========================================================
   FETCH PAGE
========================================================= */

async function fetchPage(
    page
) {

    const data =
        await apiRequest(

            "/chat/findMessages/" +
            encodeURIComponent(
                INSTANCE
            ),

            "POST",

            {
                page: page,

                offset:
                    PAGE_SIZE

            }

        );


    /*
     * YOUR ACTUAL RESPONSE:
     *
     * data.messages.records
     */

    const records =
        extractRecords(
            data
        );


    const totalPages =
        Number(
            data?.messages?.pages
        ) || 1;


    /*
     * Filter only selected number.
     */

    const matches =
        filterConversation(
            records,
            PHONE
        );


    console.log(
        "PAGE",
        page,
        "records:",
        records.length,
        "matches:",
        matches.length
    );


    return {

        records,

        matches,

        totalPages

    };

}


/* =========================================================
   EXTRACT RECORDS
========================================================= */

function extractRecords(
    data
) {

    /*
     * MAIN FORMAT
     */

    if (
        data &&
        data.messages &&
        Array.isArray(
            data.messages.records
        )
    ) {

        return data.messages.records;

    }


    /*
     * Fallback
     */

    if (
        Array.isArray(
            data
        )
    ) {

        return data;

    }


    if (
        data &&
        Array.isArray(
            data.records
        )
    ) {

        return data.records;

    }


    if (
        data &&
        Array.isArray(
            data.messages
        )
    ) {

        return data.messages;

    }


    return [];

}


/* =========================================================
   FILTER CONVERSATION
========================================================= */

function filterConversation(
    records,
    phone
) {

    const target =
        cleanNumber(
            phone
        );


    return records.filter(
        msg => {

            const key =
                msg?.key || {};


            const remoteJid =
                key.remoteJid ||
                msg.remoteJid ||
                "";


            const remoteJidAlt =
                key.remoteJidAlt ||
                msg.remoteJidAlt ||
                "";


            /*
             * Direct WhatsApp number.
             */

            if (
                jidMatches(
                    remoteJid,
                    target
                )
            ) {

                return true;

            }


            /*
             * Some versions use LID.
             */

            if (
                String(
                    remoteJid
                ).endsWith(
                    "@lid"
                )
            ) {

                if (
                    jidMatches(
                        remoteJidAlt,
                        target
                    )
                ) {

                    return true;

                }


                /*
                 * participantAlt is checked
                 * ONLY for LID chats.
                 */

                const participantAlt =
                    key.participantAlt ||
                    msg.participantAlt ||
                    "";


                if (
                    jidMatches(
                        participantAlt,
                        target
                    )
                ) {

                    return true;

                }

            }


            return false;

        }
    );

}


/* =========================================================
   JID MATCH
========================================================= */

function jidMatches(
    jid,
    target
) {

    if (!jid) {

        return false;

    }


    const value =
        String(
            jid
        );


    /*
     * Do not match groups.
     */

    if (
        value.endsWith(
            "@g.us"
        )
    ) {

        return false;

    }


    /*
     * Do not match status.
     */

    if (
        value.includes(
            "status@"
        )
    ) {

        return false;

    }


    const digits =
        cleanNumber(
            value
        );


    if (!digits) {

        return false;

    }


    return (

        digits === target ||

        digits.endsWith(
            target
        )

    );

}


/* =========================================================
   CLEAN NUMBER
========================================================= */

function cleanNumber(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    );

}


/* =========================================================
   ADD MESSAGES
========================================================= */

function addMessages(
    list
) {

    for (
        const msg
        of list
    ) {

        const id =
            getMessageId(
                msg
            );


        if (
            messageIds.has(
                id
            )
        ) {

            continue;

        }


        messageIds.add(
            id
        );


        conversationMessages.push(
            msg
        );

    }

}


/* =========================================================
   SORT
========================================================= */

function sortMessages() {

    conversationMessages.sort(
        (a, b) =>
            getTimestamp(a) -
            getTimestamp(b)
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages() {

    messagesContainer.innerHTML =
        "";


    sortMessages();


    for (
        const msg
        of conversationMessages
    ) {

        messagesContainer.appendChild(
            createMessageElement(
                msg
            )
        );

    }

}


/* =========================================================
   CREATE MESSAGE
========================================================= */

function createMessageElement(
    msg
) {

    const fromMe =
        Boolean(
            msg?.key?.fromMe
        );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +
        (
            fromMe
                ? "outgoing"
                : "incoming"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    const content =
        getMessageContent(
            msg
        );


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "time";


    time.innerText =
        formatTime(
            getTimestamp(
                msg
            )
        );


    bubble.appendChild(
        content
    );


    bubble.appendChild(
        time
    );


    wrapper.appendChild(
        bubble
    );


    return wrapper;

}


/* =========================================================
   MESSAGE CONTENT
========================================================= */

function getMessageContent(
    msg
) {

    const container =
        document.createElement(
            "div"
        );


    const message =
        msg?.message ||
        {};


    /*
     * TEXT
     */

    if (
        typeof
        message.conversation ===
        "string"
    ) {

        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =
            message.conversation;


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * EXTENDED TEXT
     */

    if (
        message.extendedTextMessage
    ) {

        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =

            message
            .extendedTextMessage
            .text ||

            "";


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * IMAGE
     */

    if (
        message.imageMessage
    ) {

        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =
            "📷 " +
            (
                message
                .imageMessage
                .caption ||
                "Image"
            );


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * VIDEO
     */

    if (
        message.videoMessage
    ) {

        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =
            "🎥 " +
            (
                message
                .videoMessage
                .caption ||
                "Video"
            );


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * AUDIO
     */

    if (
        message.audioMessage
    ) {

        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =
            "🎵 Audio";


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * DOCUMENT
     */

    if (
        message.documentMessage
    ) {

        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =
            "📄 " +
            (
                message
                .documentMessage
                .fileName ||
                "Document"
            );


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * STICKER
     */

    if (
        message.stickerMessage
    ) {

        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =
            "🖼️ Sticker";


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * UNKNOWN
     */

    const text =
        document.createElement(
            "div"
        );


    text.className =
        "text";


    text.innerText =
        "📩 " +
        (
            msg.messageType ||
            "Message"
        );


    container.appendChild(
        text
    );


    return container;

}


/* =========================================================
   MESSAGE ID
========================================================= */

function getMessageId(
    msg
) {

    return (

        msg?.key?.id ||

        msg?.id ||

        (
            "generated-" +
            getTimestamp(msg) +
            "-" +
            Math.random()
        )

    );

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestamp(
    msg
) {

    let timestamp =

        msg?.messageTimestamp ||

        msg?.timestamp ||

        0;


    if (
        typeof timestamp ===
        "object"
    ) {

        timestamp =

            timestamp.low ||

            timestamp.seconds ||

            0;

    }


    timestamp =
        Number(
            timestamp
        );


    /*
     * WhatsApp timestamp is
     * normally seconds.
     */

    if (
        timestamp > 0 &&
        timestamp < 100000000000
    ) {

        timestamp *= 1000;

    }


    return timestamp || 0;

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
    timestamp
) {

    if (!timestamp) {

        return "";

    }


    return new Date(
        timestamp
    ).toLocaleString(
        [],
        {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   NEXT FRAME
========================================================= */

function nextFrame() {

    return new Promise(
        resolve => {

            requestAnimationFrame(
                () => resolve()
            );

        }
    );

}


/* =========================================================
   SCROLL UP
========================================================= */

chat.addEventListener(
    "scroll",
    async function () {

        /*
         * Reached top.
         */

        if (
            chat.scrollTop <= 100 &&
            !loading &&
            !initialLoading &&
            currentPage < totalPages
        ) {

            await loadOlderMessages();

        }

    }
);


/* =========================================================
   LOAD OLDER MESSAGES
========================================================= */

async function loadOlderMessages() {

    if (
        loading ||
        currentPage >= totalPages
    ) {

        if (
            currentPage >= totalPages
        ) {

            endElement.innerText =
                "Beginning of conversation";

        }

        return;

    }


    loading = true;

    loadingElement.style.display =
        "block";


    /*
     * Save position.
     */

    const oldHeight =
        chat.scrollHeight;


    const oldTop =
        chat.scrollTop;


    try {

        const nextPage =
            currentPage + 1;


        setStatus(

            "Loading older messages... " +

            nextPage +
            " / " +
            totalPages

        );


        const result =
            await fetchPage(
                nextPage
            );


        currentPage =
            nextPage;


        totalPages =
            result.totalPages;


        addMessages(
            result.matches
        );


        sortMessages();


        renderMessages();


        /*
         * Wait for DOM layout.
         */

        await nextFrame();


        /*
         * Restore the user's
         * relative position.
         */

        const newHeight =
            chat.scrollHeight;


        chat.scrollTop =
            oldTop +
            (
                newHeight -
                oldHeight
            );


        setStatus(

            "Loaded " +
            conversationMessages.length +
            " messages • " +

            "page " +
            currentPage +
            "/" +
            totalPages

        );


        if (
            currentPage >=
            totalPages
        ) {

            endElement.innerText =
                "Beginning of conversation";

        }

    }
    catch (error) {

        showError(
            "Failed to load older messages.\n\n" +
            error.message
        );

    }
    finally {

        loading = false;

        loadingElement.style.display =
            "none";

    }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    if (!connected) {

        showError(
            "Connect first."
        );

        return;

    }


    sendButton.disabled =
        true;


    try {

        setStatus(
            "Sending..."
        );


        const data =
            await apiRequest(

                "/message/sendText/" +

                encodeURIComponent(
                    INSTANCE
                ),

                "POST",

                {
                    number:
                        PHONE,

                    text:
                        text
                }

            );


        input.value = "";


        /*
         * Display immediately.
         */

        const localMessage = {

            key: {

                id:
                    data?.key?.id ||
                    "local-" +
                    Date.now(),

                fromMe: true,

                remoteJid:
                    PHONE +
                    "@s.whatsapp.net"

            },

            message: {

                conversation:
                    text

            },

            messageTimestamp:
                Math.floor(
                    Date.now() / 1000
                )

        };


        addMessages(
            [
                localMessage
            ]
        );


        renderMessages();


        await nextFrame();


        chat.scrollTop =
            chat.scrollHeight;


        setStatus(
            "Message sent"
        );

    }
    catch (error) {

        showError(
            "SEND FAILED\n\n" +
            error.message
        );

    }
    finally {

        sendButton.disabled =
            false;

    }

}


/* =========================================================
   ENTER TO SEND
========================================================= */

function handleEnter(
    event
) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text
) {

    statusElement.innerText =
        text;

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    text
) {

    errorElement.innerText =
        text;

    errorElement.style.display =
        "block";

    setStatus(
        "Error"
    );

}


/* =========================================================
   CLEAR ERROR
========================================================= */

function clearError() {

    errorElement.innerText =
        "";

    errorElement.style.display =
        "none";

}

</script>
