<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Evolution WhatsApp Chat</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #111b21;

    color: #e9edef;

}


/* =========================================================
   APP
========================================================= */

.app {

    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

}


/* =========================================================
   HEADER
========================================================= */

.header {

    height: 64px;

    display: flex;
    align-items: center;

    padding: 8px 15px;

    background: #202c33;

    gap: 12px;

    flex-shrink: 0;

}


.avatar {

    width: 45px;
    height: 45px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #00a884;

    color: white;

    font-weight: bold;

}


.headerInfo {

    flex: 1;

    min-width: 0;

}


.headerTitle {

    font-size: 17px;

    font-weight: bold;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


.headerSub {

    margin-top: 3px;

    font-size: 12px;

    color: #8696a0;

}


/* =========================================================
   SETTINGS
========================================================= */

.settings {

    background: #182229;

    padding: 10px;

    display: grid;

    grid-template-columns:
        2fr
        1fr
        1.2fr
        1.5fr
        100px;

    gap: 7px;

    flex-shrink: 0;

}


.settings input {

    width: 100%;

    padding: 10px;

    border-radius: 6px;

    border: 1px solid #3b4a54;

    outline: none;

    background: #2a3942;

    color: white;

}


.settings input:focus {

    border-color: #00a884;

}


button {

    border: 0;

    border-radius: 6px;

    padding: 10px;

    background: #00a884;

    color: white;

    cursor: pointer;

    font-weight: bold;

}


button:hover {

    background: #008f72;

}


button:disabled {

    opacity: 0.5;

    cursor: not-allowed;

}


/* =========================================================
   STATUS
========================================================= */

.status {

    background: #182229;

    padding: 7px 12px;

    color: #aebac1;

    font-size: 12px;

    flex-shrink: 0;

}


/* =========================================================
   ERROR
========================================================= */

.error {

    display: none;

    margin: 8px;

    padding: 10px;

    border-radius: 6px;

    background: #4b2020;

    color: #ffb4b4;

    white-space: pre-wrap;

    font-family: monospace;

    font-size: 12px;

    max-height: 180px;

    overflow: auto;

    flex-shrink: 0;

}


/* =========================================================
   CHAT
========================================================= */

.chat {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 15px;

    background:
        #0b141a;

}


/* =========================================================
   LOADING
========================================================= */

.loading {

    display: none;

    text-align: center;

    padding: 10px;

    color: #8696a0;

    font-size: 13px;

}


/* =========================================================
   END
========================================================= */

.end {

    text-align: center;

    padding: 15px;

    color: #667781;

    font-size: 12px;

}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    display: flex;

    margin: 4px 0;

}


.message.incoming {

    justify-content: flex-start;

}


.message.outgoing {

    justify-content: flex-end;

}


.bubble {

    max-width: 70%;

    padding: 8px 10px;

    border-radius: 8px;

    word-break: break-word;

}


.incoming .bubble {

    background: #202c33;

}


.outgoing .bubble {

    background: #005c4b;

}


.text {

    white-space: pre-wrap;

    font-size: 15px;

    line-height: 1.4;

}


.time {

    margin-top: 4px;

    text-align: right;

    font-size: 10px;

    color: #aebac1;

}


/* =========================================================
   MEDIA
========================================================= */

.media {

    max-width: 300px;

    border-radius: 8px;

    display: block;

}


.caption {

    margin-top: 5px;

    white-space: pre-wrap;

}


/* =========================================================
   INPUT
========================================================= */

.bottom {

    display: flex;

    gap: 8px;

    padding: 10px;

    background: #202c33;

    flex-shrink: 0;

}


.bottom input {

    flex: 1;

    min-width: 0;

    padding: 13px;

    border: 0;

    outline: none;

    border-radius: 8px;

    background: #2a3942;

    color: white;

}


.send {

    width: 80px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 800px) {

    .settings {

        grid-template-columns:
            1fr
            1fr;

    }


    .settings button {

        grid-column: span 2;

    }


    .bubble {

        max-width: 85%;

    }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="avatar">
        WA
    </div>


    <div class="headerInfo">

        <div
            id="headerTitle"
            class="headerTitle"
        >
            WhatsApp Chat
        </div>


        <div
            id="headerSub"
            class="headerSub"
        >
            Not connected
        </div>

    </div>

</div>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div class="settings">


    <input
        id="apiUrl"
        placeholder="Evolution API URL"
        value="https://YOUR-RAILWAY-APP.up.railway.app"
    >


    <input
        id="instance"
        placeholder="Instance name"
    >


    <input
        id="phone"
        placeholder="Phone number"
        value="919605515958"
    >


    <input
        id="apiKey"
        type="password"
        placeholder="Evolution API Key"
    >


    <button
        id="connectButton"
        onclick="connect()"
    >
        Connect
    </button>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div
    id="status"
    class="status"
>
    Not connected
</div>


<!-- =====================================================
     ERROR
===================================================== -->

<div
    id="error"
    class="error"
></div>


<!-- =====================================================
     CHAT
===================================================== -->

<div
    id="chat"
    class="chat"
>


    <div
        id="loading"
        class="loading"
    >
        Loading...
    </div>


    <div
        id="messages"
    ></div>


    <div
        id="end"
        class="end"
    ></div>


</div>


<!-- =====================================================
     MESSAGE INPUT
===================================================== -->

<div class="bottom">


    <input
        id="messageInput"
        placeholder="Type a message..."
        onkeydown="handleEnter(event)"
    >


    <button
        id="sendButton"
        class="send"
        onclick="sendMessage()"
    >
        Send
    </button>

</div>


</div>



<script>

let API_URL = "";
let API_KEY = "";
let INSTANCE = "";
let PHONE = "";

const PAGE_SIZE = 50;

let currentPage = 1;
let totalPages = 1;

let loading = false;
let connected = false;

let conversationMessages = [];

const messageIds = new Set();

const chat =
    document.getElementById("chat");

const messagesContainer =
    document.getElementById("messages");

const loadingElement =
    document.getElementById("loading");

const errorElement =
    document.getElementById("error");

const statusElement =
    document.getElementById("status");

const endElement =
    document.getElementById("end");

const connectButton =
    document.getElementById("connectButton");

const sendButton =
    document.getElementById("sendButton");


/* =========================================================
   CONNECT
========================================================= */

async function connect() {

    clearError();

    API_URL =
        document
        .getElementById("apiUrl")
        .value
        .trim()
        .replace(/\/$/, "");

    API_KEY =
        document
        .getElementById("apiKey")
        .value
        .trim();

    INSTANCE =
        document
        .getElementById("instance")
        .value
        .trim();

    PHONE =
        document
        .getElementById("phone")
        .value
        .trim()
        .replace(/\D/g, "");


    if (!API_URL) {
        showError("Evolution API URL is required.");
        return;
    }

    if (!API_KEY) {
        showError("Evolution API Key is required.");
        return;
    }

    if (!INSTANCE) {
        showError("Instance name is required.");
        return;
    }

    if (!PHONE) {
        showError("Phone number is required.");
        return;
    }


    currentPage = 1;
    totalPages = 1;

    conversationMessages = [];

    messageIds.clear();

    messagesContainer.innerHTML = "";

    endElement.innerText = "";

    connected = false;

    connectButton.disabled = true;


    document.getElementById("headerTitle").innerText =
        "+" + PHONE;

    document.getElementById("headerSub").innerText =
        "Connecting...";


    try {

        await loadFirstPage();

        connected = true;

        document.getElementById("headerSub").innerText =
            "Connected";

    }
    catch (error) {

        showError(error.message);

        document.getElementById("headerSub").innerText =
            "Connection failed";

    }
    finally {

        connectButton.disabled = false;

    }
}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    endpoint,
    method = "GET",
    body = null
) {

    const options = {

        method,

        headers: {
            "Content-Type": "application/json",
            "apikey": API_KEY
        }

    };


    if (body !== null) {

        options.body =
            JSON.stringify(body);

    }


    let response;

    try {

        response =
            await fetch(
                API_URL + endpoint,
                options
            );

    }
    catch (error) {

        throw new Error(
            "Failed to fetch Evolution API.\n\n" +
            "URL:\n" +
            API_URL + endpoint
        );

    }


    const text =
        await response.text();


    let data;

    try {

        data =
            text
                ? JSON.parse(text)
                : {};

    }
    catch {

        data = text;

    }


    if (!response.ok) {

        throw new Error(
            "Evolution API HTTP " +
            response.status +
            "\n\n" +
            (
                typeof data === "string"
                    ? data
                    : JSON.stringify(
                        data,
                        null,
                        2
                    )
            )
        );

    }


    return data;
}


/* =========================================================
   LOAD FIRST PAGE
========================================================= */

async function loadFirstPage() {

    setStatus(
        "Loading conversation..."
    );

    await loadPage(
        1,
        true
    );


    /*
     * IMPORTANT:
     *
     * If the first page does not contain
     * enough messages to create a scrollbar,
     * automatically load more pages.
     */

    let safety = 0;

    while (
        chat.scrollHeight <= chat.clientHeight + 100 &&
        currentPage < totalPages &&
        safety < 10
    ) {

        safety++;

        await loadOlderPage(
            currentPage + 1,
            false
        );

    }


    /*
     * Start at the bottom.
     */

    setTimeout(() => {

        chat.scrollTop =
            chat.scrollHeight;

    }, 50);


    setStatus(
        "Loaded " +
        conversationMessages.length +
        " messages"
    );
}


/* =========================================================
   LOAD PAGE
========================================================= */

async function loadPage(
    page,
    firstPage = false
) {

    if (loading) {
        return;
    }

    if (page > totalPages) {
        return;
    }


    loading = true;

    loadingElement.style.display =
        "block";


    try {

        const data =
            await apiRequest(

                "/chat/findMessages/" +
                encodeURIComponent(
                    INSTANCE
                ),

                "POST",

                {
                    page: page,
                    offset: PAGE_SIZE
                }

            );


        /*
         * Your actual Evolution response:
         *
         * data.messages.records
         */

        const records =
            extractRecords(data);


        const pagination =
            getPagination(
                data,
                page
            );


        currentPage =
            pagination.currentPage;

        totalPages =
            pagination.pages;


        /*
         * Find this phone's messages.
         */

        const matches =
            filterConversation(
                records,
                PHONE
            );


        addMessages(
            matches
        );


        renderMessages();


        setStatus(
            "Page " +
            currentPage +
            " / " +
            totalPages +
            " • " +
            conversationMessages.length +
            " messages"
        );


    }
    finally {

        loading = false;

        loadingElement.style.display =
            "none";

    }
}


/* =========================================================
   LOAD OLDER PAGE
========================================================= */

async function loadOlderPage(
    page,
    preserveScroll = true
) {

    if (loading) {
        return;
    }

    if (page > totalPages) {

        showBeginning();

        return;

    }


    loading = true;

    loadingElement.style.display =
        "block";


    /*
     * Save current position.
     */

    const oldHeight =
        chat.scrollHeight;

    const oldTop =
        chat.scrollTop;


    try {

        setStatus(
            "Loading older messages..."
        );


        const data =
            await apiRequest(

                "/chat/findMessages/" +
                encodeURIComponent(
                    INSTANCE
                ),

                "POST",

                {
                    page: page,
                    offset: PAGE_SIZE
                }

            );


        const records =
            extractRecords(data);


        const pagination =
            getPagination(
                data,
                page
            );


        currentPage =
            pagination.currentPage;

        totalPages =
            pagination.pages;


        const matches =
            filterConversation(
                records,
                PHONE
            );


        addMessages(
            matches
        );


        /*
         * Sort oldest → newest.
         */

        conversationMessages.sort(
            (a, b) =>
                getTimestamp(a) -
                getTimestamp(b)
        );


        renderMessages();


        /*
         * Preserve exact scroll position.
         */

        if (preserveScroll) {

            const newHeight =
                chat.scrollHeight;


            chat.scrollTop =
                oldTop +
                (
                    newHeight -
                    oldHeight
                );

        }


        if (
            currentPage >=
            totalPages
        ) {

            showBeginning();

        }


        setStatus(
            "Page " +
            currentPage +
            " / " +
            totalPages +
            " • " +
            conversationMessages.length +
            " messages"
        );


    }
    finally {

        loading = false;

        loadingElement.style.display =
            "none";

    }
}


/* =========================================================
   EXTRACT RECORDS
========================================================= */

function extractRecords(data) {

    if (
        data &&
        data.messages &&
        Array.isArray(
            data.messages.records
        )
    ) {

        return data.messages.records;

    }


    if (
        Array.isArray(data)
    ) {

        return data;

    }


    if (
        data &&
        Array.isArray(
            data.records
        )
    ) {

        return data.records;

    }


    if (
        data &&
        Array.isArray(
            data.messages
        )
    ) {

        return data.messages;

    }


    return [];
}


/* =========================================================
   PAGINATION
========================================================= */

function getPagination(
    data,
    fallbackPage
) {

    if (
        data &&
        data.messages
    ) {

        return {

            pages:
                Number(
                    data.messages.pages
                ) || 1,

            currentPage:
                Number(
                    data.messages.currentPage
                ) ||
                fallbackPage

        };

    }


    return {

        pages: 1,

        currentPage: fallbackPage

    };
}


/* =========================================================
   FILTER PHONE
========================================================= */

function filterConversation(
    records,
    phone
) {

    const target =
        cleanNumber(phone);


    return records.filter(
        msg => {

            const key =
                msg?.key || {};


            const remoteJid =
                key.remoteJid ||
                msg.remoteJid ||
                "";


            const remoteJidAlt =
                key.remoteJidAlt ||
                msg.remoteJidAlt ||
                "";


            /*
             * Direct WhatsApp chat.
             */

            if (
                jidMatches(
                    remoteJid,
                    target
                )
            ) {

                return true;

            }


            /*
             * LID direct chat.
             */

            if (
                String(
                    remoteJid
                ).endsWith("@lid")
            ) {

                if (
                    jidMatches(
                        remoteJidAlt,
                        target
                    )
                ) {

                    return true;

                }

            }


            return false;

        }
    );
}


/* =========================================================
   JID MATCH
========================================================= */

function jidMatches(
    jid,
    target
) {

    if (!jid) {
        return false;
    }


    const value =
        String(jid);


    /*
     * Never treat group chats as
     * private chats.
     */

    if (
        value.endsWith("@g.us")
    ) {

        return false;

    }


    if (
        value.includes("status@")
    ) {

        return false;

    }


    const digits =
        cleanNumber(value);


    return (
        digits === target ||
        digits.endsWith(target)
    );
}


/* =========================================================
   CLEAN NUMBER
========================================================= */

function cleanNumber(value) {

    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    );
}


/* =========================================================
   ADD MESSAGES
========================================================= */

function addMessages(list) {

    for (
        const msg
        of list
    ) {

        const id =
            getMessageId(msg);


        if (
            messageIds.has(id)
        ) {

            continue;

        }


        messageIds.add(id);

        conversationMessages.push(
            msg
        );

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages() {

    messagesContainer.innerHTML =
        "";


    conversationMessages.sort(
        (a, b) =>
            getTimestamp(a) -
            getTimestamp(b)
    );


    for (
        const msg
        of conversationMessages
    ) {

        messagesContainer.appendChild(
            createMessageElement(
                msg
            )
        );

    }
}


/* =========================================================
   CREATE MESSAGE
========================================================= */

function createMessageElement(msg) {

    const fromMe =
        Boolean(
            msg?.key?.fromMe
        );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +
        (
            fromMe
                ? "outgoing"
                : "incoming"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    const text =
        document.createElement(
            "div"
        );


    text.className =
        "text";


    text.innerText =
        getMessageText(msg);


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "time";


    time.innerText =
        formatTime(
            getTimestamp(msg)
        );


    bubble.appendChild(text);

    bubble.appendChild(time);

    wrapper.appendChild(bubble);


    return wrapper;
}


/* =========================================================
   MESSAGE TEXT
========================================================= */

function getMessageText(msg) {

    const message =
        msg?.message || {};


    if (
        typeof message.conversation ===
        "string"
    ) {

        return message.conversation;

    }


    if (
        message.extendedTextMessage
    ) {

        return (
            message
            .extendedTextMessage
            .text ||
            ""
        );

    }


    if (
        message.imageMessage
    ) {

        return (
            "📷 " +
            (
                message
                .imageMessage
                .caption ||
                "Image"
            )
        );

    }


    if (
        message.videoMessage
    ) {

        return (
            "🎥 " +
            (
                message
                .videoMessage
                .caption ||
                "Video"
            )
        );

    }


    if (
        message.audioMessage
    ) {

        return "🎵 Audio";

    }


    if (
        message.documentMessage
    ) {

        return (
            "📄 " +
            (
                message
                .documentMessage
                .fileName ||
                "Document"
            )
        );

    }


    if (
        message.stickerMessage
    ) {

        return "🖼️ Sticker";

    }


    return (
        msg.messageType ||
        "Message"
    );
}


/* =========================================================
   MESSAGE ID
========================================================= */

function getMessageId(msg) {

    return (
        msg?.key?.id ||
        msg?.id ||
        (
            "generated-" +
            Math.random()
        )
    );
}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestamp(msg) {

    let t =
        msg?.messageTimestamp ||
        msg?.timestamp ||
        0;


    if (
        typeof t === "object"
    ) {

        t =
            t.low ||
            t.seconds ||
            0;

    }


    t =
        Number(t);


    if (
        t > 0 &&
        t < 100000000000
    ) {

        t *= 1000;

    }


    return t;
}


/* =========================================================
   TIME
========================================================= */

function formatTime(timestamp) {

    if (!timestamp) {
        return "";
    }


    return new Date(
        timestamp
    ).toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   THE IMPORTANT SCROLL HANDLER
========================================================= */

chat.addEventListener(
    "scroll",
    async () => {

        /*
         * User reached the TOP.
         *
         * Load older messages.
         */

        if (
            chat.scrollTop <= 80 &&
            !loading &&
            currentPage < totalPages
        ) {

            const oldHeight =
                chat.scrollHeight;

            const oldTop =
                chat.scrollTop;


            await loadOlderPage(
                currentPage + 1,
                false
            );


            /*
             * Restore position after
             * adding messages.
             */

            const newHeight =
                chat.scrollHeight;


            chat.scrollTop =
                oldTop +
                (
                    newHeight -
                    oldHeight
                );

        }

    }
);


/* =========================================================
   ALSO SUPPORT MOUSE WHEEL
========================================================= */

chat.addEventListener(
    "wheel",
    async (event) => {

        /*
         * If the user is scrolling upward
         * and is already near the top,
         * load another page.
         */

        if (
            event.deltaY < 0 &&
            chat.scrollTop <= 80 &&
            !loading &&
            currentPage < totalPages
        ) {

            await loadOlderPage(
                currentPage + 1,
                true
            );

        }

    }
);


/* =========================================================
   TOUCH / MOBILE
========================================================= */

let touchStartY = 0;


chat.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length
        ) {

            touchStartY =
                event.touches[0].clientY;

        }

    }
);


chat.addEventListener(
    "touchmove",
    async event => {

        if (
            !event.touches.length
        ) {

            return;

        }


        const currentY =
            event.touches[0].clientY;


        /*
         * Finger moving down while
         * already at the top =
         * user wants older messages.
         */

        if (
            currentY > touchStartY &&
            chat.scrollTop <= 80 &&
            !loading &&
            currentPage < totalPages
        ) {

            await loadOlderPage(
                currentPage + 1,
                true
            );

        }

    }
);


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    if (!connected) {

        showError(
            "Connect first."
        );

        return;

    }


    sendButton.disabled = true;


    try {

        const data =
            await apiRequest(

                "/message/sendText/" +
                encodeURIComponent(
                    INSTANCE
                ),

                "POST",

                {
                    number: PHONE,
                    text: text
                }

            );


        input.value = "";


        /*
         * Show immediately.
         */

        const localMessage = {

            key: {

                id:
                    data?.key?.id ||
                    "local-" +
                    Date.now(),

                fromMe: true,

                remoteJid:
                    PHONE +
                    "@s.whatsapp.net"

            },

            message: {

                conversation:
                    text

            },

            messageTimestamp:
                Math.floor(
                    Date.now() / 1000
                )

        };


        addMessages(
            [localMessage]
        );


        renderMessages();


        setTimeout(
            () => {

                chat.scrollTop =
                    chat.scrollHeight;

            },
            50
        );


        setStatus(
            "Message sent"
        );

    }
    catch (error) {

        showError(
            "SEND FAILED\n\n" +
            error.message
        );

    }
    finally {

        sendButton.disabled = false;

    }

}


/* =========================================================
   ENTER
========================================================= */

function handleEnter(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusElement.innerText =
        text;

}


/* =========================================================
   ERROR
========================================================= */

function showError(text) {

    errorElement.innerText =
        text;

    errorElement.style.display =
        "block";

    setStatus(
        "Error"
    );

}


/* =========================================================
   CLEAR ERROR
========================================================= */

function clearError() {

    errorElement.innerText =
        "";

    errorElement.style.display =
        "none";

}

</script>
