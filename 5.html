<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evolution WhatsApp Chat</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111b21;
    color:#e9edef;
    font-family:Arial,Helvetica,sans-serif;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.header{
    background:#202c33;
    padding:12px;
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#00a884;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.title{
    font-size:17px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    color:#8696a0;
    margin-top:3px;
}

/* ================= SETTINGS ================= */

.settings{
    background:#182229;
    padding:10px;
    display:grid;
    grid-template-columns:2fr 1fr 1.5fr 2fr 100px;
    gap:8px;
}

.settings input{
    width:100%;
    padding:10px;
    background:#2a3942;
    color:white;
    border:1px solid #3b4a54;
    border-radius:6px;
    outline:none;
}

button{
    background:#00a884;
    border:0;
    color:white;
    border-radius:6px;
    cursor:pointer;
    padding:10px;
}

button:hover{
    background:#008f72;
}

/* ================= STATUS ================= */

.status{
    background:#182229;
    color:#aebac1;
    font-size:13px;
    padding:7px 12px;
}

.error{
    background:#4b2020;
    color:#ffb4b4;
    padding:10px;
    margin:10px;
    border-radius:6px;
    white-space:pre-wrap;
    display:none;
}

/* ================= CHAT ================= */

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.loading{
    text-align:center;
    color:#8696a0;
    padding:10px;
    display:none;
}

.end{
    text-align:center;
    color:#667781;
    font-size:12px;
    padding:15px;
}

/* ================= MESSAGES ================= */

.message{
    display:flex;
    margin:5px 0;
}

.message.incoming{
    justify-content:flex-start;
}

.message.outgoing{
    justify-content:flex-end;
}

.bubble{
    max-width:70%;
    padding:8px 10px;
    border-radius:8px;
    word-break:break-word;
}

.incoming .bubble{
    background:#202c33;
}

.outgoing .bubble{
    background:#005c4b;
}

.text{
    white-space:pre-wrap;
    font-size:15px;
}

.time{
    font-size:10px;
    color:#aebac1;
    text-align:right;
    margin-top:4px;
}

/* ================= INPUT ================= */

.input{
    background:#202c33;
    padding:10px;
    display:flex;
    gap:8px;
}

.input input{
    flex:1;
    background:#2a3942;
    color:white;
    border:0;
    outline:none;
    padding:13px;
    border-radius:8px;
}

.send{
    width:80px;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    .settings{
        grid-template-columns:1fr 1fr;
    }

    .settings input{
        min-width:0;
    }

    .settings button{
        grid-column:span 2;
    }

    .bubble{
        max-width:85%;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="avatar">
            WA
        </div>

        <div>

            <div
                class="title"
                id="title"
            >
                WhatsApp Chat
            </div>

            <div
                class="subtitle"
                id="subtitle"
            >
                Not connected
            </div>

        </div>

    </div>


    <!-- SETTINGS -->

    <div class="settings">

        <input
            id="apiUrl"
            placeholder="Evolution API URL"
            value="https://YOUR-RAILWAY-URL"
        >

        <input
            id="instance"
            placeholder="Instance"
        >

        <input
            id="phone"
            placeholder="Phone e.g. 919605515958"
            value="919605515958"
        >

        <input
            id="apiKey"
            type="password"
            placeholder="Evolution API Key"
        >

        <button
            onclick="connect()"
        >
            Connect
        </button>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status"
    >
        Not connected
    </div>


    <!-- ERROR -->

    <div
        class="error"
        id="error"
    ></div>


    <!-- CHAT -->

    <div
        class="chat"
        id="chat"
    >

        <div
            class="loading"
            id="loading"
        >
            Loading...
        </div>

        <div
            id="messages"
        ></div>

        <div
            class="end"
            id="end"
        ></div>

    </div>


    <!-- SEND -->

    <div class="input">

        <input
            id="messageInput"
            placeholder="Type a message..."
            onkeydown="handleEnter(event)"
        >

        <button
            class="send"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

</div>


<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let API_URL = "";
let API_KEY = "";
let INSTANCE = "";
let PHONE = "";

let CHAT_JID = "";

let page = 1;

const LIMIT = 30;

let loading = false;

let hasMore = true;

let messagesLoaded = 0;

const messageIds =
    new Set();


/* =========================================================
   DOM
========================================================= */

const chat =
    document.getElementById(
        "chat"
    );

const messages =
    document.getElementById(
        "messages"
    );

const loadingElement =
    document.getElementById(
        "loading"
    );

const errorElement =
    document.getElementById(
        "error"
    );

const endElement =
    document.getElementById(
        "end"
    );

const statusElement =
    document.getElementById(
        "status"
    );


/* =========================================================
   CONNECT
========================================================= */

async function connect(){

    clearError();


    API_URL =
        document
        .getElementById(
            "apiUrl"
        )
        .value
        .trim()
        .replace(
            /\/$/,
            ""
        );


    API_KEY =
        document
        .getElementById(
            "apiKey"
        )
        .value
        .trim();


    INSTANCE =
        document
        .getElementById(
            "instance"
        )
        .value
        .trim();


    PHONE =
        document
        .getElementById(
            "phone"
        )
        .value
        .trim()
        .replace(
            /\D/g,
            ""
        );


    if(
        !API_URL ||
        !API_KEY ||
        !INSTANCE ||
        !PHONE
    ){

        showError(
            "Please enter API URL, instance, phone and API key."
        );

        return;

    }


    CHAT_JID =
        PHONE +
        "@s.whatsapp.net";


    page = 1;

    hasMore = true;

    loading = false;

    messagesLoaded = 0;

    messageIds.clear();

    messages.innerHTML = "";

    endElement.innerText = "";


    document
        .getElementById(
            "title"
        )
        .innerText =
        "+" + PHONE;


    document
        .getElementById(
            "subtitle"
        )
        .innerText =
        CHAT_JID;


    setStatus(
        "Connecting to Evolution API..."
    );


    try{

        /*
         * First check that Evolution API
         * itself is reachable.
         */

        await testConnection();


        /*
         * Try to find the actual chat/JID.
         */

        setStatus(
            "Finding chat..."
        );


        await findChat();


        /*
         * Load latest messages.
         */

        await loadMessages(
            true
        );


    }
    catch(error){

        showError(
            error.message
        );

    }

}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    endpoint,
    method="GET",
    body=null
){

    const options = {

        method:method,

        headers:{
            "Content-Type":
                "application/json",

            "apikey":
                API_KEY
        }

    };


    if(
        body !== null
    ){

        options.body =
            JSON.stringify(
                body
            );

    }


    console.log(
        "API REQUEST:",
        API_URL +
        endpoint
    );


    const response =
        await fetch(
            API_URL +
            endpoint,
            options
        );


    const text =
        await response.text();


    console.log(
        "HTTP:",
        response.status
    );

    console.log(
        "RESPONSE:",
        text
    );


    let data;


    try{

        data =
            text
                ? JSON.parse(text)
                : {};

    }
    catch{

        data = text;

    }


    if(
        !response.ok
    ){

        throw new Error(

            "HTTP " +
            response.status +
            "\n\n" +

            (
                typeof data ===
                "string"

                ? data

                : JSON.stringify(
                    data,
                    null,
                    2
                )
            )

        );

    }


    return data;

}


/* =========================================================
   TEST API
========================================================= */

async function testConnection(){

    try{

        await apiRequest(
            "/",
            "GET"
        );

        setStatus(
            "Evolution API reachable"
        );

    }
    catch(error){

        throw new Error(
            "Cannot connect to Evolution API.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   FIND CHAT
========================================================= */

async function findChat(){

    /*
     * Try the chats endpoint.
     */

    const possibleEndpoints = [

        "/chat/findChats/" +
        encodeURIComponent(
            INSTANCE
        ),

        "/chat/findChats/" +
        encodeURIComponent(
            INSTANCE
        )

    ];


    let chats = null;


    for(
        const endpoint
        of possibleEndpoints
    ){

        try{

            const data =
                await apiRequest(
                    endpoint,
                    "POST",
                    {
                        where:{
                            id:
                                CHAT_JID
                        }
                    }
                );


            chats =
                extractChats(
                    data
                );


            if(
                chats.length
            ){

                break;

            }

        }
        catch(error){

            console.warn(
                "Chat search failed:",
                error.message
            );

        }

    }


    /*
     * Even if chat search does not work,
     * use the normal WhatsApp JID.
     */

    if(
        chats &&
        chats.length
    ){

        const found =
            chats.find(
                chat => {

                    const jid =
                        getChatJid(
                            chat
                        );

                    return (
                        jid ===
                        CHAT_JID
                    );

                }
            );


        if(found){

            CHAT_JID =
                getChatJid(
                    found
                );

        }

    }


    console.log(
        "Using JID:",
        CHAT_JID
    );


    setStatus(
        "Using chat: " +
        CHAT_JID
    );

}


/* =========================================================
   EXTRACT CHATS
========================================================= */

function extractChats(
    data
){

    if(
        Array.isArray(
            data
        )
    ){

        return data;

    }


    if(
        data &&
        Array.isArray(
            data.chats
        )
    ){

        return data.chats;

    }


    if(
        data &&
        Array.isArray(
            data.response
        )
    ){

        return data.response;

    }


    if(
        data &&
        Array.isArray(
            data.data
        )
    ){

        return data.data;

    }


    return [];

}


/* =========================================================
   CHAT JID
========================================================= */

function getChatJid(
    chat
){

    return (

        chat.id ||

        (
            chat.key &&
            chat.key.remoteJid
        ) ||

        chat.remoteJid ||

        ""

    );

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(
    initial=false
){

    if(
        loading ||
        !hasMore
    ){

        return;

    }


    loading = true;

    loadingElement.style.display =
        "block";


    const oldHeight =
        chat.scrollHeight;

    const oldTop =
        chat.scrollTop;


    try{

        setStatus(
            "Loading messages..."
        );


        /*
         * Main Evolution API endpoint.
         */

        const endpoint =

            "/chat/findMessages/" +

            encodeURIComponent(
                INSTANCE
            );


        /*
         * Query the exact JID.
         */

        const body = {

            where:{

                key:{

                    remoteJid:
                        CHAT_JID

                }

            },

            page:
                page,

            limit:
                LIMIT

        };


        const data =
            await apiRequest(

                endpoint,

                "POST",

                body

            );


        console.log(
            "MESSAGE DATA:",
            data
        );


        const list =
            extractMessages(
                data
            );


        console.log(
            "MESSAGES FOUND:",
            list.length
        );


        if(
            !list.length
        ){

            if(
                initial
            ){

                /*
                 * Try the alternative
                 * query format.
                 */

                const alternative =
                    await tryAlternativeHistory();


                if(
                    alternative.length
                ){

                    displayMessages(
                        alternative,
                        true
                    );

                    return;

                }

            }


            hasMore = false;

            endElement.innerText =
                "No messages found for +" +
                PHONE;

            setStatus(
                "Connected, but Evolution API returned 0 messages."
            );

            return;

        }


        displayMessages(
            list,
            initial
        );


        if(
            list.length <
            LIMIT
        ){

            hasMore = false;

            endElement.innerText =
                "Beginning of conversation";

        }
        else{

            page++;

        }


        setStatus(
            "Loaded " +
            messagesLoaded +
            " messages"
        );


    }
    catch(error){

        showError(
            "FAILED TO LOAD MESSAGES\n\n" +
            error.message
        );

    }
    finally{

        loading = false;

        loadingElement.style.display =
            "none";

    }

}


/* =========================================================
   ALTERNATIVE HISTORY QUERY
========================================================= */

async function tryAlternativeHistory(){

    console.log(
        "Trying alternative history query..."
    );


    const endpoint =

        "/chat/findMessages/" +

        encodeURIComponent(
            INSTANCE
        );


    const queries = [

        {
            where:{
                key:{
                    remoteJid:
                        CHAT_JID
                }
            },

            page:page,

            limit:LIMIT
        },


        {
            where:{
                remoteJid:
                    CHAT_JID
            },

            page:page,

            limit:LIMIT
        },


        {
            remoteJid:
                CHAT_JID,

            page:page,

            limit:LIMIT
        }

    ];


    for(
        const body
        of queries
    ){

        try{

            const data =
                await apiRequest(

                    endpoint,

                    "POST",

                    body

                );


            const list =
                extractMessages(
                    data
                );


            if(
                list.length
            ){

                console.log(
                    "Alternative query worked:",
                    body
                );

                return list;

            }

        }
        catch(error){

            console.warn(
                "Alternative failed:",
                error.message
            );

        }

    }


    return [];

}


/* =========================================================
   DISPLAY MESSAGES
========================================================= */

function displayMessages(
    list,
    initial
){

    const oldHeight =
        chat.scrollHeight;

    const oldTop =
        chat.scrollTop;


    const unique = [];


    for(
        const msg
        of list
    ){

        const id =
            getId(
                msg
            );


        if(
            messageIds.has(
                id
            )
        ){

            continue;

        }


        messageIds.add(
            id
        );


        unique.push(
            msg
        );

    }


    unique.sort(
        (a,b)=>
            getTimestamp(a) -
            getTimestamp(b)
    );


    if(
        initial
    ){

        unique.forEach(
            msg =>
                addMessage(
                    msg
                )
        );

    }
    else{

        unique
            .reverse()
            .forEach(
                msg =>
                    addMessageTop(
                        msg
                    )
            );

    }


    messagesLoaded =
        messageIds.size;


    if(
        !initial
    ){

        const newHeight =
            chat.scrollHeight;


        chat.scrollTop =
            oldTop +
            (
                newHeight -
                oldHeight
            );

    }
    else{

        setTimeout(
            () => {

                chat.scrollTop =
                    chat.scrollHeight;

            },
            100
        );

    }

}


/* =========================================================
   EXTRACT MESSAGES
========================================================= */

function extractMessages(
    data
){

    if(
        Array.isArray(
            data
        )
    ){

        return data;

    }


    if(
        data &&
        Array.isArray(
            data.messages
        )
    ){

        return data.messages;

    }


    if(
        data &&
        Array.isArray(
            data.response
        )
    ){

        return data.response;

    }


    if(
        data &&
        data.response &&
        Array.isArray(
            data.response.messages
        )
    ){

        return data.response.messages;

    }


    if(
        data &&
        Array.isArray(
            data.data
        )
    ){

        return data.data;

    }


    if(
        data &&
        data.data &&
        Array.isArray(
            data.data.messages
        )
    ){

        return data.data.messages;

    }


    return [];

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    msg
){

    const element =
        createMessage(
            msg
        );


    messages.appendChild(
        element
    );

}


/* =========================================================
   ADD MESSAGE TOP
========================================================= */

function addMessageTop(
    msg
){

    const element =
        createMessage(
            msg
        );


    messages.prepend(
        element
    );

}


/* =========================================================
   CREATE MESSAGE
========================================================= */

function createMessage(
    msg
){

    const fromMe =
        !!(
            msg.key &&
            msg.key.fromMe
        );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +
        (
            fromMe
                ? "outgoing"
                : "incoming"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    const text =
        document.createElement(
            "div"
        );


    text.className =
        "text";


    text.innerText =
        getMessageText(
            msg
        );


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "time";


    time.innerText =
        formatTime(
            getTimestamp(
                msg
            )
        );


    bubble.appendChild(
        text
    );

    bubble.appendChild(
        time
    );

    wrapper.appendChild(
        bubble
    );


    return wrapper;

}


/* =========================================================
   MESSAGE TEXT
========================================================= */

function getMessageText(
    msg
){

    const m =
        msg.message ||
        {};


    if(
        typeof m.conversation ===
        "string"
    ){

        return m.conversation;

    }


    if(
        m.extendedTextMessage
    ){

        return (
            m.extendedTextMessage.text ||
            ""
        );

    }


    if(
        m.imageMessage
    ){

        return (
            "📷 " +
            (
                m.imageMessage.caption ||
                "Image"
            )
        );

    }


    if(
        m.videoMessage
    ){

        return (
            "🎥 " +
            (
                m.videoMessage.caption ||
                "Video"
            )
        );

    }


    if(
        m.audioMessage
    ){

        return "🎵 Audio";

    }


    if(
        m.documentMessage
    ){

        return (
            "📄 " +
            (
                m.documentMessage.fileName ||
                "Document"
            )
        );

    }


    if(
        m.stickerMessage
    ){

        return "🖼️ Sticker";

    }


    return (
        msg.messageType ||
        "Message"
    );

}


/* =========================================================
   MESSAGE ID
========================================================= */

function getId(
    msg
){

    return (

        msg.key &&
        msg.key.id

    ) ||

    msg.id ||

    (
        "generated-" +
        Math.random()
            .toString(36)
            .slice(2)
    );

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestamp(
    msg
){

    let timestamp =

        msg.messageTimestamp ||

        msg.timestamp ||

        0;


    if(
        typeof timestamp ===
        "object"
    ){

        timestamp =

            timestamp.low ||

            timestamp.seconds ||

            0;

    }


    if(
        timestamp >
        100000000000
    ){

        return timestamp;

    }


    return timestamp * 1000;

}


/* =========================================================
   TIME
========================================================= */

function formatTime(
    timestamp
){

    if(
        !timestamp
    ){

        return "";

    }


    return new Date(
        timestamp
    ).toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   SCROLL UP
========================================================= */

chat.addEventListener(
    "scroll",
    () => {

        if(
            chat.scrollTop <= 120 &&
            !loading &&
            hasMore
        ){

            loadMessages(
                false
            );

        }

    }
);


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(
        !text
    ){

        return;

    }


    try{

        await apiRequest(

            "/message/sendText/" +

            encodeURIComponent(
                INSTANCE
            ),

            "POST",

            {
                number:
                    PHONE,

                text:
                    text

            }

        );


        input.value = "";

        setStatus(
            "Message sent"
        );


    }
    catch(error){

        showError(
            "SEND FAILED\n\n" +
            error.message
        );

    }

}


/* =========================================================
   ENTER SEND
========================================================= */

function handleEnter(
    event
){

    if(
        event.key ===
        "Enter"
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text
){

    statusElement.innerText =
        text;

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    text
){

    errorElement.innerText =
        text;

    errorElement.style.display =
        "block";

    setStatus(
        "Error"
    );

}


/* =========================================================
   CLEAR ERROR
========================================================= */

function clearError(){

    errorElement.innerText =
        "";

    errorElement.style.display =
        "none";

}

</script>

</body>
</html>
