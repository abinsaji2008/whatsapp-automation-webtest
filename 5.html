<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evolution WhatsApp Chat</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#111b21;
    color:#e9edef;
}

body{
    overflow:hidden;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{

    height:65px;

    background:#202c33;

    display:flex;

    align-items:center;

    padding:8px 15px;

    gap:12px;

}

.avatar{

    width:45px;
    height:45px;

    border-radius:50%;

    background:#00a884;

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:bold;

}

.headerInfo{
    flex:1;
}

.headerTitle{
    font-size:17px;
    font-weight:bold;
}

.headerSub{
    margin-top:3px;
    font-size:12px;
    color:#8696a0;
}


/* =========================
   SETTINGS
========================= */

.settings{

    background:#182229;

    padding:10px;

    display:grid;

    grid-template-columns:
        2fr
        1fr
        1.5fr
        2fr
        100px;

    gap:7px;

}

.settings input{

    width:100%;

    padding:10px;

    border-radius:6px;

    border:1px solid #3b4a54;

    outline:none;

    background:#2a3942;

    color:white;

}

.settings input:focus{

    border-color:#00a884;

}

button{

    border:0;

    border-radius:6px;

    padding:10px;

    background:#00a884;

    color:white;

    cursor:pointer;

}

button:hover{

    background:#008f72;

}


/* =========================
   STATUS
========================= */

.status{

    background:#182229;

    padding:7px 12px;

    color:#aebac1;

    font-size:12px;

}


/* =========================
   ERROR
========================= */

.error{

    display:none;

    margin:8px;

    padding:10px;

    border-radius:6px;

    background:#4b2020;

    color:#ffb4b4;

    white-space:pre-wrap;

    font-family:monospace;

    font-size:12px;

    max-height:180px;

    overflow:auto;

}


/* =========================
   CHAT
========================= */

.chat{

    flex:1;

    overflow-y:auto;

    padding:15px;

    scroll-behavior:auto;

}

.loading{

    display:none;

    text-align:center;

    padding:10px;

    color:#8696a0;

    font-size:13px;

}

.end{

    text-align:center;

    padding:15px;

    color:#667781;

    font-size:12px;

}


/* =========================
   MESSAGE
========================= */

.message{

    display:flex;

    margin:4px 0;

}

.message.incoming{

    justify-content:flex-start;

}

.message.outgoing{

    justify-content:flex-end;

}

.bubble{

    max-width:70%;

    padding:8px 10px;

    border-radius:8px;

    word-break:break-word;

}

.incoming .bubble{

    background:#202c33;

}

.outgoing .bubble{

    background:#005c4b;

}

.text{

    white-space:pre-wrap;

    font-size:15px;

    line-height:1.35;

}

.time{

    margin-top:4px;

    text-align:right;

    font-size:10px;

    color:#aebac1;

}


/* =========================
   INPUT
========================= */

.bottom{

    display:flex;

    gap:8px;

    padding:10px;

    background:#202c33;

}

.bottom input{

    flex:1;

    padding:13px;

    border:0;

    outline:none;

    border-radius:8px;

    background:#2a3942;

    color:white;

}

.send{

    width:80px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .settings{

        grid-template-columns:
            1fr
            1fr;

    }

    .settings button{

        grid-column:
            span 2;

    }

    .bubble{

        max-width:85%;

    }

}

</style>

</head>

<body>

<div class="app">


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div class="avatar">
        WA
    </div>

    <div class="headerInfo">

        <div
            id="headerTitle"
            class="headerTitle"
        >
            WhatsApp Chat
        </div>

        <div
            id="headerSub"
            class="headerSub"
        >
            Not connected
        </div>

    </div>

</div>


<!-- =========================
     SETTINGS
========================= -->

<div class="settings">

    <input
        id="apiUrl"
        placeholder="Evolution API URL"
        value="https://YOUR-RAILWAY-APP.up.railway.app"
    >

    <input
        id="instance"
        placeholder="Instance name"
    >

    <input
        id="phone"
        placeholder="Phone number"
        value="919605515958"
    >

    <input
        id="apiKey"
        type="password"
        placeholder="Evolution API key"
    >

    <button
        onclick="connect()"
    >
        Connect
    </button>

</div>


<!-- =========================
     STATUS
========================= -->

<div
    id="status"
    class="status"
>
    Not connected
</div>


<!-- =========================
     ERROR
========================= -->

<div
    id="error"
    class="error"
></div>


<!-- =========================
     CHAT
========================= -->

<div
    id="chat"
    class="chat"
>

    <div
        id="loading"
        class="loading"
    >
        Loading...
    </div>

    <div
        id="messages"
    ></div>

    <div
        id="end"
        class="end"
    ></div>

</div>


<!-- =========================
     MESSAGE INPUT
========================= -->

<div class="bottom">

    <input
        id="messageInput"
        placeholder="Type a message..."
        onkeydown="handleEnter(event)"
    >

    <button
        class="send"
        onclick="sendMessage()"
    >
        Send
    </button>

</div>


</div>


<script>

/* =========================================================
   VARIABLES
========================================================= */

let API_URL = "";

let API_KEY = "";

let INSTANCE = "";

let PHONE = "";

let PAGE = 1;

const LIMIT = 30;

let loading = false;

let hasMore = true;


/*
 * All messages returned by Evolution.
 */

let allMessages = [];


/*
 * Messages currently displayed.
 */

let displayedMessages = [];


/*
 * Used to prevent duplicate messages.
 */

const displayedIds = new Set();


/* =========================================================
   DOM
========================================================= */

const chat =
    document.getElementById(
        "chat"
    );

const messagesContainer =
    document.getElementById(
        "messages"
    );

const loadingElement =
    document.getElementById(
        "loading"
    );

const errorElement =
    document.getElementById(
        "error"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const endElement =
    document.getElementById(
        "end"
    );


/* =========================================================
   CONNECT
========================================================= */

async function connect(){

    clearError();


    API_URL =
        document
        .getElementById(
            "apiUrl"
        )
        .value
        .trim()
        .replace(
            /\/$/,
            ""
        );


    API_KEY =
        document
        .getElementById(
            "apiKey"
        )
        .value
        .trim();


    INSTANCE =
        document
        .getElementById(
            "instance"
        )
        .value
        .trim();


    PHONE =
        document
        .getElementById(
            "phone"
        )
        .value
        .trim()
        .replace(
            /\D/g,
            ""
        );


    if(!API_URL){

        showError(
            "Evolution API URL is empty."
        );

        return;

    }


    if(!API_KEY){

        showError(
            "API key is empty."
        );

        return;

    }


    if(!INSTANCE){

        showError(
            "Instance name is empty."
        );

        return;

    }


    if(!PHONE){

        showError(
            "Phone number is empty."
        );

        return;

    }


    document
        .getElementById(
            "headerTitle"
        )
        .innerText =
        "+" + PHONE;


    document
        .getElementById(
            "headerSub"
        )
        .innerText =
        "Loading conversation";


    PAGE = 1;

    hasMore = true;

    allMessages = [];

    displayedMessages = [];

    displayedIds.clear();

    messagesContainer.innerHTML = "";

    endElement.innerText = "";


    try{

        setStatus(
            "Connecting..."
        );


        /*
         * Get messages WITHOUT
         * remoteJid filter.
         */

        await loadAllMessages();


    }
    catch(error){

        showError(
            error.message
        );

    }

}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    endpoint,
    method = "GET",
    body = null
){

    const options = {

        method:method,

        headers:{

            "Content-Type":
                "application/json",

            "apikey":
                API_KEY

        }

    };


    if(body !== null){

        options.body =
            JSON.stringify(
                body
            );

    }


    console.log(
        "REQUEST:",
        API_URL + endpoint
    );


    if(body !== null){

        console.log(
            "BODY:",
            body
        );

    }


    const response =
        await fetch(
            API_URL + endpoint,
            options
        );


    const text =
        await response.text();


    console.log(
        "STATUS:",
        response.status
    );


    console.log(
        "RESPONSE:",
        text
    );


    let data;


    try{

        data =
            text
                ? JSON.parse(text)
                : {};

    }
    catch{

        data = text;

    }


    if(!response.ok){

        throw new Error(

            "HTTP " +
            response.status +
            "\n\n" +

            (
                typeof data ===
                "string"

                    ? data

                    : JSON.stringify(
                        data,
                        null,
                        2
                    )

            )

        );

    }


    return data;

}


/* =========================================================
   LOAD ALL MESSAGES
========================================================= */

async function loadAllMessages(){

    loading = true;

    loadingElement.style.display =
        "block";


    setStatus(
        "Fetching Evolution messages..."
    );


    try{

        /*
         * IMPORTANT:
         *
         * Empty body.
         *
         * We deliberately do NOT send
         * remoteJid because some Evolution
         * versions have problems with that
         * filter.
         */

        const data =
            await apiRequest(

                "/chat/findMessages/" +

                encodeURIComponent(
                    INSTANCE
                ),

                "POST",

                {}

            );


        console.log(
            "RAW EVOLUTION DATA:",
            data
        );


        const list =
            extractMessages(
                data
            );


        console.log(
            "TOTAL API MESSAGES:",
            list.length
        );


        if(!list.length){

            setStatus(
                "Evolution returned 0 messages."
            );


            endElement.innerText =
                "No messages returned by Evolution API.";


            /*
             * Show raw response for debugging.
             */

            showError(

                "Evolution API returned no messages.\n\n" +

                "RAW RESPONSE:\n" +

                JSON.stringify(
                    data,
                    null,
                    2
                )

            );


            return;

        }


        /*
         * Save everything locally.
         */

        allMessages =
            list;


        /*
         * Find messages belonging to
         * the requested phone.
         */

        const matching =
            filterMessagesForPhone(
                list,
                PHONE
            );


        console.log(
            "MATCHING MESSAGES:",
            matching.length
        );


        /*
         * If exact number matching gives
         * zero, show available JIDs.
         *
         * This is extremely useful for
         * diagnosing @lid.
         */

        if(!matching.length){

            const jids =
                getAvailableJids(
                    list
                );


            showError(

                "Evolution returned " +
                list.length +
                " messages, but none matched +" +
                PHONE +
                ".\n\n" +

                "AVAILABLE JIDs:\n\n" +

                jids.join("\n")

            );


            setStatus(
                "Messages exist, but phone/JID did not match."
            );


            return;

        }


        /*
         * Sort newest first internally.
         */

        matching.sort(
            (a,b)=>
                getTimestamp(b) -
                getTimestamp(a)
        );


        /*
         * Keep all matching messages.
         */

        allMessages =
            matching;


        /*
         * Display newest 30.
         */

        displayedMessages =
            matching
            .slice(
                0,
                LIMIT
            )
            .reverse();


        renderMessages();


        /*
         * Determine whether more
         * messages exist.
         */

        hasMore =
            matching.length >
            LIMIT;


        if(hasMore){

            PAGE = 2;

        }
        else{

            hasMore = false;

            endElement.innerText =
                "Beginning of conversation";

        }


        /*
         * Scroll to bottom.
         */

        setTimeout(
            () => {

                chat.scrollTop =
                    chat.scrollHeight;

            },
            100
        );


        setStatus(

            "Loaded " +
            matching.length +
            " messages"

        );


    }
    finally{

        loading = false;

        loadingElement.style.display =
            "none";

    }

}


/* =========================================================
   FILTER BY PHONE
========================================================= */

function filterMessagesForPhone(
    list,
    phone
){

    const cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );


    return list.filter(
        msg => {

            const jid =
                getRemoteJid(
                    msg
                );


            if(!jid){

                return false;

            }


            /*
             * Convert JID to digits.
             *
             * Works for:
             *
             * 919605515958@s.whatsapp.net
             *
             * 919605515958@lid
             */

            const jidDigits =
                jid.replace(
                    /\D/g,
                    ""
                );


            /*
             * Exact match.
             */

            if(
                jidDigits ===
                cleanPhone
            ){

                return true;

            }


            /*
             * Some JID formats may contain
             * extra identifiers.
             *
             * Check whether the cleaned JID
             * ends with the phone number.
             */

            if(
                jidDigits.endsWith(
                    cleanPhone
                )
            ){

                return true;

            }


            return false;

        }
    );

}


/* =========================================================
   GET REMOTE JID
========================================================= */

function getRemoteJid(
    msg
){

    return (

        msg?.key?.remoteJid ||

        msg?.remoteJid ||

        msg?.key?.participant ||

        ""

    );

}


/* =========================================================
   AVAILABLE JIDS
========================================================= */

function getAvailableJids(
    list
){

    const set =
        new Set();


    for(
        const msg
        of list
    ){

        const jid =
            getRemoteJid(
                msg
            );


        if(jid){

            set.add(
                jid
            );

        }

    }


    return [
        ...set
    ].slice(
        0,
        100
    );

}


/* =========================================================
   EXTRACT MESSAGES
========================================================= */

function extractMessages(
    data
){

    if(
        Array.isArray(
            data
        )
    ){

        return data;

    }


    if(
        Array.isArray(
            data.messages
        )
    ){

        return data.messages;

    }


    if(
        Array.isArray(
            data.response
        )
    ){

        return data.response;

    }


    if(
        data.response &&
        Array.isArray(
            data.response.messages
        )
    ){

        return data.response.messages;

    }


    if(
        Array.isArray(
            data.data
        )
    ){

        return data.data;

    }


    if(
        data.data &&
        Array.isArray(
            data.data.messages
        )
    ){

        return data.data.messages;

    }


    return [];

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    messagesContainer.innerHTML = "";

    displayedIds.clear();


    for(
        const msg
        of displayedMessages
    ){

        const id =
            getMessageId(
                msg
            );


        if(
            displayedIds.has(
                id
            )
        ){

            continue;

        }


        displayedIds.add(
            id
        );


        messagesContainer.appendChild(
            createMessageElement(
                msg
            )
        );

    }

}


/* =========================================================
   SCROLL UP
========================================================= */

chat.addEventListener(
    "scroll",
    () => {

        if(
            chat.scrollTop <= 100 &&
            !loading &&
            hasMore
        ){

            loadOlderMessages();

        }

    }
);


/* =========================================================
   LOAD OLDER
========================================================= */

async function loadOlderMessages(){

    if(
        loading ||
        !hasMore
    ){

        return;

    }


    loading = true;

    loadingElement.style.display =
        "block";


    const oldHeight =
        chat.scrollHeight;


    const oldTop =
        chat.scrollTop;


    try{

        /*
         * We already fetched all matching
         * messages.
         *
         * Take the next 30 older messages.
         */

        const start =
            displayedMessages.length;


        const older =
            allMessages.slice(
                start,
                start + LIMIT
            );


        if(!older.length){

            hasMore = false;

            endElement.innerText =
                "Beginning of conversation";

            return;

        }


        /*
         * allMessages is newest → oldest.
         *
         * Convert to oldest → newest
         * before adding to top.
         */

        const olderForDisplay =
            older.reverse();


        displayedMessages =
            olderForDisplay.concat(
                displayedMessages
            );


        renderMessages();


        if(
            displayedMessages.length >=
            allMessages.length
        ){

            hasMore = false;

            endElement.innerText =
                "Beginning of conversation";

        }


        /*
         * Preserve scroll position.
         */

        const newHeight =
            chat.scrollHeight;


        chat.scrollTop =
            oldTop +
            (
                newHeight -
                oldHeight
            );


    }
    finally{

        loading = false;

        loadingElement.style.display =
            "none";

    }

}


/* =========================================================
   CREATE MESSAGE
========================================================= */

function createMessageElement(
    msg
){

    const fromMe =
        Boolean(
            msg?.key?.fromMe
        );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +
        (
            fromMe
                ? "outgoing"
                : "incoming"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    const text =
        document.createElement(
            "div"
        );


    text.className =
        "text";


    text.innerText =
        getMessageText(
            msg
        );


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "time";


    time.innerText =
        formatTime(
            getTimestamp(
                msg
            )
        );


    bubble.appendChild(
        text
    );


    bubble.appendChild(
        time
    );


    wrapper.appendChild(
        bubble
    );


    return wrapper;

}


/* =========================================================
   MESSAGE TEXT
========================================================= */

function getMessageText(
    msg
){

    const message =
        msg?.message ||
        {};


    if(
        typeof message.conversation ===
        "string"
    ){

        return message.conversation;

    }


    if(
        message.extendedTextMessage
    ){

        return (

            message
            .extendedTextMessage
            .text ||

            ""

        );

    }


    if(
        message.imageMessage
    ){

        return (

            "📷 " +

            (
                message
                .imageMessage
                .caption ||

                "Image"
            )

        );

    }


    if(
        message.videoMessage
    ){

        return (

            "🎥 " +

            (
                message
                .videoMessage
                .caption ||

                "Video"
            )

        );

    }


    if(
        message.audioMessage
    ){

        return "🎵 Audio";

    }


    if(
        message.documentMessage
    ){

        return (

            "📄 " +

            (
                message
                .documentMessage
                .fileName ||

                "Document"
            )

        );

    }


    if(
        message.stickerMessage
    ){

        return "🖼️ Sticker";

    }


    return (
        msg.messageType ||
        "Message"
    );

}


/* =========================================================
   MESSAGE ID
========================================================= */

function getMessageId(
    msg
){

    return (

        msg?.key?.id ||

        msg?.id ||

        (
            "generated-" +
            Math.random()
                .toString(36)
                .slice(2)
        )

    );

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestamp(
    msg
){

    let t =

        msg?.messageTimestamp ||

        msg?.timestamp ||

        0;


    if(
        typeof t ===
        "object"
    ){

        t =

            t.low ||

            t.seconds ||

            0;

    }


    t =
        Number(t);


    if(
        !t
    ){

        return 0;

    }


    if(
        t < 100000000000
    ){

        return t * 1000;

    }


    return t;

}


/* =========================================================
   TIME
========================================================= */

function formatTime(
    timestamp
){

    if(
        !timestamp
    ){

        return "";

    }


    return new Date(
        timestamp
    ).toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(
        !text
    ){

        return;

    }


    try{

        setStatus(
            "Sending..."
        );


        /*
         * Current Evolution API docs use
         * /message/sendText/{instance}.
         */

        const data =
            await apiRequest(

                "/message/sendText/" +

                encodeURIComponent(
                    INSTANCE
                ),

                "POST",

                {

                    number:
                        PHONE,

                    text:
                        text

                }

            );


        console.log(
            "SEND RESULT:",
            data
        );


        input.value = "";


        /*
         * Add sent message immediately.
         */

        const newMessage = {

            key:{

                id:
                    data?.key?.id ||

                    (
                        "local-" +
                        Date.now()
                    ),

                fromMe:true,

                remoteJid:
                    getRemoteJid(
                        data
                    ) ||

                    (
                        PHONE +
                        "@s.whatsapp.net"
                    )

            },

            message:{

                conversation:
                    text

            },

            messageTimestamp:
                Math.floor(
                    Date.now() / 1000
                )

        };


        displayedMessages.push(
            newMessage
        );


        renderMessages();


        chat.scrollTop =
            chat.scrollHeight;


        setStatus(
            "Message sent"
        );


    }
    catch(error){

        showError(
            "SEND FAILED\n\n" +
            error.message
        );

    }

}


/* =========================================================
   ENTER
========================================================= */

function handleEnter(
    event
){

    if(
        event.key ===
        "Enter"
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text
){

    statusElement.innerText =
        text;

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    text
){

    errorElement.innerText =
        text;

    errorElement.style.display =
        "block";

    setStatus(
        "Error"
    );

}


/* =========================================================
   CLEAR ERROR
========================================================= */

function clearError(){

    errorElement.innerText =
        "";

    errorElement.style.display =
        "none";

}

</script>
