<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Evolution WhatsApp Chat</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #111b21;

    color: #e9edef;

}


/* =========================================================
   APP
========================================================= */

.app {

    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

}


/* =========================================================
   HEADER
========================================================= */

.header {

    height: 64px;

    display: flex;
    align-items: center;

    padding: 8px 15px;

    background: #202c33;

    gap: 12px;

    flex-shrink: 0;

}


.avatar {

    width: 45px;
    height: 45px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #00a884;

    color: white;

    font-weight: bold;

}


.headerInfo {

    flex: 1;

    min-width: 0;

}


.headerTitle {

    font-size: 17px;

    font-weight: bold;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


.headerSub {

    margin-top: 3px;

    font-size: 12px;

    color: #8696a0;

}


/* =========================================================
   SETTINGS
========================================================= */

.settings {

    background: #182229;

    padding: 10px;

    display: grid;

    grid-template-columns:
        2fr
        1fr
        1.2fr
        1.5fr
        100px;

    gap: 7px;

    flex-shrink: 0;

}


.settings input {

    width: 100%;

    padding: 10px;

    border-radius: 6px;

    border: 1px solid #3b4a54;

    outline: none;

    background: #2a3942;

    color: white;

}


.settings input:focus {

    border-color: #00a884;

}


button {

    border: 0;

    border-radius: 6px;

    padding: 10px;

    background: #00a884;

    color: white;

    cursor: pointer;

    font-weight: bold;

}


button:hover {

    background: #008f72;

}


button:disabled {

    opacity: 0.5;

    cursor: not-allowed;

}


/* =========================================================
   STATUS
========================================================= */

.status {

    background: #182229;

    padding: 7px 12px;

    color: #aebac1;

    font-size: 12px;

    flex-shrink: 0;

}


/* =========================================================
   ERROR
========================================================= */

.error {

    display: none;

    margin: 8px;

    padding: 10px;

    border-radius: 6px;

    background: #4b2020;

    color: #ffb4b4;

    white-space: pre-wrap;

    font-family: monospace;

    font-size: 12px;

    max-height: 180px;

    overflow: auto;

    flex-shrink: 0;

}


/* =========================================================
   CHAT
========================================================= */

.chat {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 15px;

    background:
        #0b141a;

}


/* =========================================================
   LOADING
========================================================= */

.loading {

    display: none;

    text-align: center;

    padding: 10px;

    color: #8696a0;

    font-size: 13px;

}


/* =========================================================
   END
========================================================= */

.end {

    text-align: center;

    padding: 15px;

    color: #667781;

    font-size: 12px;

}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    display: flex;

    margin: 4px 0;

}


.message.incoming {

    justify-content: flex-start;

}


.message.outgoing {

    justify-content: flex-end;

}


.bubble {

    max-width: 70%;

    padding: 8px 10px;

    border-radius: 8px;

    word-break: break-word;

}


.incoming .bubble {

    background: #202c33;

}


.outgoing .bubble {

    background: #005c4b;

}


.text {

    white-space: pre-wrap;

    font-size: 15px;

    line-height: 1.4;

}


.time {

    margin-top: 4px;

    text-align: right;

    font-size: 10px;

    color: #aebac1;

}


/* =========================================================
   MEDIA
========================================================= */

.media {

    max-width: 300px;

    border-radius: 8px;

    display: block;

}


.caption {

    margin-top: 5px;

    white-space: pre-wrap;

}


/* =========================================================
   INPUT
========================================================= */

.bottom {

    display: flex;

    gap: 8px;

    padding: 10px;

    background: #202c33;

    flex-shrink: 0;

}


.bottom input {

    flex: 1;

    min-width: 0;

    padding: 13px;

    border: 0;

    outline: none;

    border-radius: 8px;

    background: #2a3942;

    color: white;

}


.send {

    width: 80px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 800px) {

    .settings {

        grid-template-columns:
            1fr
            1fr;

    }


    .settings button {

        grid-column: span 2;

    }


    .bubble {

        max-width: 85%;

    }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="avatar">
        WA
    </div>


    <div class="headerInfo">

        <div
            id="headerTitle"
            class="headerTitle"
        >
            WhatsApp Chat
        </div>


        <div
            id="headerSub"
            class="headerSub"
        >
            Not connected
        </div>

    </div>

</div>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div class="settings">


    <input
        id="apiUrl"
        placeholder="Evolution API URL"
        value="https://YOUR-RAILWAY-APP.up.railway.app"
    >


    <input
        id="instance"
        placeholder="Instance name"
    >


    <input
        id="phone"
        placeholder="Phone number"
        value="919605515958"
    >


    <input
        id="apiKey"
        type="password"
        placeholder="Evolution API Key"
    >


    <button
        id="connectButton"
        onclick="connect()"
    >
        Connect
    </button>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div
    id="status"
    class="status"
>
    Not connected
</div>


<!-- =====================================================
     ERROR
===================================================== -->

<div
    id="error"
    class="error"
></div>


<!-- =====================================================
     CHAT
===================================================== -->

<div
    id="chat"
    class="chat"
>


    <div
        id="loading"
        class="loading"
    >
        Loading...
    </div>


    <div
        id="messages"
    ></div>


    <div
        id="end"
        class="end"
    ></div>


</div>


<!-- =====================================================
     MESSAGE INPUT
===================================================== -->

<div class="bottom">


    <input
        id="messageInput"
        placeholder="Type a message..."
        onkeydown="handleEnter(event)"
    >


    <button
        id="sendButton"
        class="send"
        onclick="sendMessage()"
    >
        Send
    </button>

</div>


</div>



<script>


/* =========================================================
   GLOBAL VARIABLES
========================================================= */


let API_URL = "";

let API_KEY = "";

let INSTANCE = "";

let PHONE = "";


/*
 * Evolution pagination.
 *
 * Your API response says:
 *
 * total: 11854
 * pages: 238
 * currentPage: 1
 *
 */

const PAGE_SIZE = 50;

let currentPage = 1;

let totalPages = 1;


/*
 * Messages that belong to
 * the selected conversation.
 */

let conversationMessages = [];


/*
 * IDs already displayed.
 */

const messageIds = new Set();


/*
 * Prevent multiple requests.
 */

let loading = false;


/*
 * Connection state.
 */

let connected = false;


/* =========================================================
   DOM
========================================================= */


const chat =
    document.getElementById(
        "chat"
    );


const messagesContainer =
    document.getElementById(
        "messages"
    );


const loadingElement =
    document.getElementById(
        "loading"
    );


const errorElement =
    document.getElementById(
        "error"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const endElement =
    document.getElementById(
        "end"
    );


const connectButton =
    document.getElementById(
        "connectButton"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


/* =========================================================
   CONNECT
========================================================= */


async function connect() {

    clearError();


    API_URL =
        document
        .getElementById(
            "apiUrl"
        )
        .value
        .trim()
        .replace(
            /\/$/,
            ""
        );


    API_KEY =
        document
        .getElementById(
            "apiKey"
        )
        .value
        .trim();


    INSTANCE =
        document
        .getElementById(
            "instance"
        )
        .value
        .trim();


    PHONE =
        document
        .getElementById(
            "phone"
        )
        .value
        .trim()
        .replace(
            /\D/g,
            ""
        );


    /* -----------------------------------------------------
       VALIDATION
    ----------------------------------------------------- */


    if (!API_URL) {

        showError(
            "Evolution API URL is required."
        );

        return;

    }


    if (!API_KEY) {

        showError(
            "Evolution API Key is required."
        );

        return;

    }


    if (!INSTANCE) {

        showError(
            "Instance name is required."
        );

        return;

    }


    if (!PHONE) {

        showError(
            "Phone number is required."
        );

        return;

    }


    /* -----------------------------------------------------
       RESET
    ----------------------------------------------------- */


    currentPage = 1;

    totalPages = 1;

    conversationMessages = [];

    messageIds.clear();

    messagesContainer.innerHTML = "";

    endElement.innerText = "";

    connected = false;


    document
        .getElementById(
            "headerTitle"
        )
        .innerText =
        "+" + PHONE;


    document
        .getElementById(
            "headerSub"
        )
        .innerText =
        "Connecting...";


    connectButton.disabled = true;


    try {

        setStatus(
            "Connecting to Evolution API..."
        );


        /*
         * First request.
         *
         * This uses the actual response format
         * from your server:
         *
         * messages.records
         */

        await loadPage(
            1,
            true
        );


        connected = true;


        document
            .getElementById(
                "headerSub"
            )
            .innerText =
            "Connected";


        setStatus(
            "Connected"
        );


    }
    catch (error) {

        showError(
            error.message
        );


        document
            .getElementById(
                "headerSub"
            )
            .innerText =
            "Connection failed";

    }
    finally {

        connectButton.disabled = false;

    }

}


/* =========================================================
   API REQUEST
========================================================= */


async function apiRequest(
    endpoint,
    method = "GET",
    body = null
) {


    const options = {

        method: method,

        headers: {

            "Content-Type":
                "application/json",

            "apikey":
                API_KEY

        }

    };


    if (body !== null) {

        options.body =
            JSON.stringify(
                body
            );

    }


    console.log(
        "Evolution REQUEST:",
        API_URL + endpoint
    );


    console.log(
        "Evolution BODY:",
        body
    );


    let response;


    try {

        response =
            await fetch(
                API_URL + endpoint,
                options
            );

    }
    catch (error) {

        throw new Error(

            "Failed to fetch Evolution API.\n\n" +

            "URL:\n" +

            API_URL + endpoint +

            "\n\n" +

            "This is usually caused by CORS, an incorrect Railway URL, HTTPS/HTTP mismatch, or the server being offline."

        );

    }


    const text =
        await response.text();


    console.log(
        "Evolution STATUS:",
        response.status
    );


    console.log(
        "Evolution RESPONSE:",
        text
    );


    let data;


    try {

        data =
            text
                ? JSON.parse(text)
                : {};

    }
    catch {

        data = text;

    }


    if (!response.ok) {

        throw new Error(

            "Evolution API HTTP " +

            response.status +

            "\n\n" +

            (
                typeof data ===
                "string"

                    ? data

                    : JSON.stringify(
                        data,
                        null,
                        2
                    )

            )

        );

    }


    return data;

}


/* =========================================================
   LOAD PAGE
========================================================= */


async function loadPage(
    page,
    firstLoad = false
) {


    if (loading) {

        return;

    }


    if (
        page > totalPages
    ) {

        hasReachedBeginning();

        return;

    }


    loading = true;

    loadingElement.style.display =
        "block";


    if (firstLoad) {

        setStatus(
            "Loading messages..."
        );

    }
    else {

        setStatus(
            "Loading older messages..."
        );

    }


    try {


        /*
         * Evolution API accepts pagination
         * for findMessages.
         *
         * offset = number of records per page
         * page   = page number
         */

        const body = {

            page: page,

            offset: PAGE_SIZE

        };


        const data =
            await apiRequest(

                "/chat/findMessages/" +

                encodeURIComponent(
                    INSTANCE
                ),

                "POST",

                body

            );


        console.log(
            "FULL PAGE DATA:",
            data
        );


        /*
         * Get records from:
         *
         * data.messages.records
         */

        const records =
            extractRecords(
                data
            );


        /*
         * Get pagination information.
         */

        const pagination =
            getPagination(
                data,
                page
            );


        totalPages =
            pagination.pages;


        currentPage =
            pagination.currentPage;


        console.log(
            "PAGE:",
            currentPage
        );


        console.log(
            "TOTAL PAGES:",
            totalPages
        );


        console.log(
            "RECORDS:",
            records.length
        );


        /*
         * Find messages belonging to
         * the requested phone number.
         */

        const matches =
            filterConversation(
                records,
                PHONE
            );


        console.log(
            "MATCHES ON PAGE:",
            matches.length
        );


        /*
         * Add matching messages.
         */

        addConversationMessages(
            matches
        );


        /*
         * If this is first load and
         * no message was found, keep
         * scanning older pages automatically.
         */

        if (
            firstLoad &&
            matches.length === 0
        ) {


            setStatus(

                "Searching page " +
                page +
                " of " +
                totalPages +
                "..."

            );


            /*
             * Search pages until the
             * selected conversation is found.
             *
             * Maximum safety limit.
             */

            let found = false;


            for (
                let p = page + 1;

                p <= totalPages;

                p++
            ) {


                if (
                    conversationMessages.length > 0
                ) {

                    found = true;

                    break;

                }


                setStatus(

                    "Searching conversation: page " +
                    p +
                    " / " +
                    totalPages

                );


                const nextData =
                    await apiRequest(

                        "/chat/findMessages/" +

                        encodeURIComponent(
                            INSTANCE
                        ),

                        "POST",

                        {

                            page: p,

                            offset: PAGE_SIZE

                        }

                    );


                const nextRecords =
                    extractRecords(
                        nextData
                    );


                const nextMatches =
                    filterConversation(
                        nextRecords,
                        PHONE
                    );


                addConversationMessages(
                    nextMatches
                );


                currentPage =
                    p;


                if (
                    nextMatches.length > 0
                ) {

                    found = true;

                    break;

                }

            }


            if (
                conversationMessages.length === 0
            ) {

                showNoMessagesFound(
                    data
                );

                return;

            }

        }


        /*
         * Sort oldest → newest.
         */

        conversationMessages.sort(
            (a, b) =>
                getTimestamp(a) -
                getTimestamp(b)
        );


        /*
         * Render.
         */

        renderMessages();


        /*
         * Scroll behavior.
         */

        if (firstLoad) {

            setTimeout(
                () => {

                    chat.scrollTop =
                        chat.scrollHeight;

                },
                50
            );

        }


        /*
         * If we reached the last API page.
         */

        if (
            currentPage >=
            totalPages
        ) {

            hasReachedBeginning();

        }


        setStatus(

            "Loaded " +
            conversationMessages.length +
            " messages"

        );


    }
    finally {

        loading = false;

        loadingElement.style.display =
            "none";

    }

}


/* =========================================================
   EXTRACT RECORDS
========================================================= */


function extractRecords(
    data
) {


    /*
     * THIS IS THE IMPORTANT FIX.
     *
     * Your response:
     *
     * data.messages.records
     */

    if (

        data &&

        data.messages &&

        Array.isArray(
            data.messages.records
        )

    ) {

        return data.messages.records;

    }


    /*
     * Other formats for compatibility.
     */

    if (
        Array.isArray(data)
    ) {

        return data;

    }


    if (
        data &&
        Array.isArray(
            data.records
        )
    ) {

        return data.records;

    }


    if (
        data &&
        Array.isArray(
            data.messages
        )
    ) {

        return data.messages;

    }


    if (
        data &&
        Array.isArray(
            data.data
        )
    ) {

        return data.data;

    }


    if (
        data &&
        data.response &&
        Array.isArray(
            data.response
        )
    ) {

        return data.response;

    }


    return [];

}


/* =========================================================
   GET PAGINATION
========================================================= */


function getPagination(
    data,
    fallbackPage
) {


    if (
        data &&
        data.messages
    ) {

        return {

            pages:
                Number(
                    data.messages.pages
                ) || 1,

            currentPage:
                Number(
                    data.messages.currentPage
                ) ||
                fallbackPage

        };

    }


    return {

        pages: 1,

        currentPage:
            fallbackPage

    };

}


/* =========================================================
   FILTER CONVERSATION
========================================================= */


function filterConversation(
    records,
    phone
) {


    const target =
        cleanNumber(
            phone
        );


    return records.filter(
        msg => {


            const key =
                msg?.key || {};


            const remoteJid =
                key.remoteJid ||
                msg.remoteJid ||
                "";


            const remoteJidAlt =
                key.remoteJidAlt ||
                msg.remoteJidAlt ||
                "";


            const participantAlt =
                key.participantAlt ||
                msg.participantAlt ||
                "";


            /*
             * NORMAL DIRECT CHAT
             *
             * 919605515958@s.whatsapp.net
             */

            if (
                jidMatchesNumber(
                    remoteJid,
                    target
                )
            ) {

                return true;

            }


            /*
             * LID DIRECT CHAT
             *
             * Example:
             *
             * 123456789@lid
             *
             * participantAlt:
             *
             * 919605515958@s.whatsapp.net
             */

            if (
                String(
                    remoteJid
                ).endsWith(
                    "@lid"
                )
            ) {


                if (
                    jidMatchesNumber(
                        remoteJidAlt,
                        target
                    )
                ) {

                    return true;

                }


                if (
                    jidMatchesNumber(
                        participantAlt,
                        target
                    )
                ) {

                    return true;

                }

            }


            /*
             * DO NOT match participantAlt
             * for group messages.
             *
             * Your uploaded response contains:
             *
             * remoteJid = ...@g.us
             * participantAlt = phone@s.whatsapp.net
             *
             * Those are group messages, not
             * the private chat with that number.
             */

            return false;

        }
    );

}


/* =========================================================
   JID MATCH
========================================================= */


function jidMatchesNumber(
    jid,
    target
) {


    if (!jid) {

        return false;

    }


    const value =
        String(jid);


    /*
     * Ignore groups.
     */

    if (
        value.endsWith(
            "@g.us"
        )
    ) {

        return false;

    }


    /*
     * Ignore broadcasts.
     */

    if (
        value.includes(
            "status@"
        )
    ) {

        return false;

    }


    const digits =
        cleanNumber(
            value
        );


    if (!digits) {

        return false;

    }


    return (

        digits === target ||

        digits.endsWith(target)

    );

}


/* =========================================================
   CLEAN NUMBER
========================================================= */


function cleanNumber(
    value
) {


    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    );

}


/* =========================================================
   ADD MESSAGES
========================================================= */


function addConversationMessages(
    messages
) {


    for (
        const msg
        of messages
    ) {


        const id =
            getMessageId(
                msg
            );


        if (
            messageIds.has(
                id
            )
        ) {

            continue;

        }


        messageIds.add(
            id
        );


        conversationMessages.push(
            msg
        );

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */


function renderMessages() {


    messagesContainer.innerHTML =
        "";


    /*
     * Always sort oldest → newest.
     */

    conversationMessages.sort(
        (a, b) =>
            getTimestamp(a) -
            getTimestamp(b)
    );


    for (
        const msg
        of conversationMessages
    ) {


        messagesContainer.appendChild(

            createMessageElement(
                msg
            )

        );

    }

}


/* =========================================================
   CREATE MESSAGE
========================================================= */


function createMessageElement(
    msg
) {


    const fromMe =
        Boolean(
            msg?.key?.fromMe
        );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +

        (
            fromMe
                ? "outgoing"
                : "incoming"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    const content =
        createMessageContent(
            msg
        );


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "time";


    time.innerText =
        formatTime(
            getTimestamp(
                msg
            )
        );


    bubble.appendChild(
        content
    );


    bubble.appendChild(
        time
    );


    wrapper.appendChild(
        bubble
    );


    return wrapper;

}


/* =========================================================
   CREATE MESSAGE CONTENT
========================================================= */


function createMessageContent(
    msg
) {


    const container =
        document.createElement(
            "div"
        );


    const message =
        msg?.message || {};


    /*
     * TEXT
     */

    if (
        typeof
        message.conversation ===
        "string"
    ) {


        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =
            message.conversation;


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * EXTENDED TEXT
     */

    if (
        message.extendedTextMessage
    ) {


        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =

            message
            .extendedTextMessage
            .text ||

            "";


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * IMAGE
     */

    if (
        message.imageMessage
    ) {


        const image =
            document.createElement(
                "img"
            );


        image.className =
            "media";


        image.src =

            message
            .imageMessage
            .jpegThumbnail

                ? "data:image/jpeg;base64," +

                    message
                    .imageMessage
                    .jpegThumbnail

                : "";


        image.alt =
            "Image";


        container.appendChild(
            image
        );


        const caption =

            message
            .imageMessage
            .caption;


        if (caption) {

            const c =
                document.createElement(
                    "div"
                );


            c.className =
                "caption";


            c.innerText =
                caption;


            container.appendChild(
                c
            );

        }


        return container;

    }


    /*
     * VIDEO
     */

    if (
        message.videoMessage
    ) {


        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =
            "🎥 Video";


        const caption =

            message
            .videoMessage
            .caption;


        if (caption) {

            text.innerText +=
                "\n" +
                caption;

        }


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * AUDIO
     */

    if (
        message.audioMessage
    ) {


        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =
            "🎵 Audio";


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * DOCUMENT
     */

    if (
        message.documentMessage
    ) {


        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =

            "📄 " +

            (
                message
                .documentMessage
                .fileName ||

                "Document"
            );


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * STICKER
     */

    if (
        message.stickerMessage
    ) {


        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text";


        text.innerText =
            "🖼️ Sticker";


        container.appendChild(
            text
        );


        return container;

    }


    /*
     * UNKNOWN MESSAGE
     */

    const text =
        document.createElement(
            "div"
        );


    text.className =
        "text";


    text.innerText =

        "📩 " +

        (
            msg.messageType ||
            "Message"
        );


    container.appendChild(
        text
    );


    return container;

}


/* =========================================================
   MESSAGE ID
========================================================= */


function getMessageId(
    msg
) {


    return (

        msg?.key?.id ||

        msg?.id ||

        (
            "unknown-" +
            getTimestamp(msg) +
            "-" +
            Math.random()
        )

    );

}


/* =========================================================
   TIMESTAMP
========================================================= */


function getTimestamp(
    msg
) {


    let timestamp =

        msg?.messageTimestamp ||

        msg?.timestamp ||

        0;


    if (
        typeof timestamp ===
        "object"
    ) {


        timestamp =

            timestamp.low ||

            timestamp.seconds ||

            0;

    }


    timestamp =
        Number(
            timestamp
        );


    /*
     * Seconds → milliseconds
     */

    if (
        timestamp > 0 &&
        timestamp < 100000000000
    ) {

        timestamp *= 1000;

    }


    return timestamp || 0;

}


/* =========================================================
   TIME
========================================================= */


function formatTime(
    timestamp
) {


    if (!timestamp) {

        return "";

    }


    const date =
        new Date(
            timestamp
        );


    return date.toLocaleString(
        [],
        {

            day: "2-digit",

            month: "2-digit",

            hour: "2-digit",

            minute: "2-digit"

        }
    );

}


/* =========================================================
   SCROLL UP
========================================================= */


chat.addEventListener(
    "scroll",
    async function () {


        /*
         * When user reaches the top,
         * load the next Evolution page.
         */

        if (
            chat.scrollTop <= 100 &&
            !loading &&
            currentPage < totalPages
        ) {


            /*
             * Save current height.
             *
             * This lets us keep the user's
             * position after adding older
             * messages.
             */

            const oldHeight =
                chat.scrollHeight;


            const oldTop =
                chat.scrollTop;


            const nextPage =
                currentPage + 1;


            await loadOlderPage(
                nextPage
            );


            /*
             * Keep scroll position.
             */

            const newHeight =
                chat.scrollHeight;


            chat.scrollTop =

                oldTop +

                (
                    newHeight -
                    oldHeight
                );

        }

    }
);


/* =========================================================
   LOAD OLDER PAGE
========================================================= */


async function loadOlderPage(
    page
) {


    if (
        loading ||
        page > totalPages
    ) {

        return;

    }


    loading = true;

    loadingElement.style.display =
        "block";


    try {


        setStatus(

            "Loading older messages... " +

            page +

            " / " +

            totalPages

        );


        const data =
            await apiRequest(

                "/chat/findMessages/" +

                encodeURIComponent(
                    INSTANCE
                ),

                "POST",

                {

                    page: page,

                    offset: PAGE_SIZE

                }

            );


        const records =
            extractRecords(
                data
            );


        const matches =
            filterConversation(
                records,
                PHONE
            );


        addConversationMessages(
            matches
        );


        currentPage =
            page;


        /*
         * Sort and render.
         */

        conversationMessages.sort(
            (a, b) =>
                getTimestamp(a) -
                getTimestamp(b)
        );


        renderMessages();


        if (
            currentPage >=
            totalPages
        ) {

            hasReachedBeginning();

        }


        setStatus(

            "Loaded " +

            conversationMessages.length +

            " messages"

        );


    }
    catch (error) {


        showError(
            "Failed to load older messages.\n\n" +
            error.message
        );


    }
    finally {

        loading = false;

        loadingElement.style.display =
            "none";

    }

}


/* =========================================================
   BEGINNING
========================================================= */


function hasReachedBeginning() {


    endElement.innerText =
        "Beginning of conversation";

}


/* =========================================================
   NO MESSAGES
========================================================= */


function showNoMessagesFound(
    data
) {


    setStatus(
        "No messages found for +" +
        PHONE
    );


    endElement.innerText =
        "No messages found for +" +
        PHONE;


    /*
     * Show useful debugging information.
     */

    const firstRecords =
        extractRecords(
            data
        );


    const jids =
        [];


    for (
        const msg
        of firstRecords
    ) {


        const key =
            msg?.key || {};


        const values = [

            key.remoteJid,

            key.remoteJidAlt,

            key.participant,

            key.participantAlt

        ];


        for (
            const value
            of values
        ) {


            if (
                value &&
                !jids.includes(
                    value
                )
            ) {

                jids.push(
                    value
                );

            }

        }

    }


    showError(

        "No messages found for +" +

        PHONE +

        ".\n\n" +

        "The API itself is returning messages.\n\n" +

        "Some JIDs from the API:\n\n" +

        jids
            .slice(0, 30)
            .join("\n")

    );

}


/* =========================================================
   SEND MESSAGE
========================================================= */


async function sendMessage() {


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    if (!connected) {

        showError(
            "Connect to Evolution API first."
        );

        return;

    }


    sendButton.disabled =
        true;


    clearError();


    try {


        setStatus(
            "Sending message..."
        );


        /*
         * Evolution sendText endpoint.
         */

        const data =
            await apiRequest(

                "/message/sendText/" +

                encodeURIComponent(
                    INSTANCE
                ),

                "POST",

                {

                    number:
                        PHONE,

                    text:
                        text

                }

            );


        console.log(
            "SEND RESULT:",
            data
        );


        input.value =
            "";


        /*
         * Add local outgoing message
         * immediately.
         */

        const localMessage = {

            key: {

                id:

                    data?.key?.id ||

                    (
                        "local-" +
                        Date.now()
                    ),

                fromMe: true,

                remoteJid:

                    data?.key?.remoteJid ||

                    (
                        PHONE +
                        "@s.whatsapp.net"
                    )

            },

            message: {

                conversation:
                    text

            },

            messageTimestamp:

                Math.floor(
                    Date.now() /
                    1000
                )

        };


        addConversationMessages(
            [
                localMessage
            ]
        );


        conversationMessages.sort(
            (a, b) =>
                getTimestamp(a) -
                getTimestamp(b)
        );


        renderMessages();


        /*
         * Scroll to bottom.
         */

        setTimeout(
            () => {

                chat.scrollTop =
                    chat.scrollHeight;

            },
            50
        );


        setStatus(
            "Message sent"
        );


    }
    catch (error) {


        showError(

            "SEND FAILED\n\n" +

            error.message

        );

    }
    finally {

        sendButton.disabled =
            false;

    }

}


/* =========================================================
   ENTER TO SEND
========================================================= */


function handleEnter(
    event
) {


    if (
        event.key ===
        "Enter"
    ) {


        if (
            event.shiftKey
        ) {

            return;

        }


        event.preventDefault();


        sendMessage();

    }

}


/* =========================================================
   STATUS
========================================================= */


function setStatus(
    text
) {


    statusElement.innerText =
        text;

}


/* =========================================================
   ERROR
========================================================= */


function showError(
    text
) {


    errorElement.innerText =
        text;


    errorElement.style.display =
        "block";


    setStatus(
        "Error"
    );

}


/* =========================================================
   CLEAR ERROR
========================================================= */


function clearError() {


    errorElement.innerText =
        "";


    errorElement.style.display =
        "none";

}


/* =========================================================
   START
========================================================= */


console.log(
    "Evolution WhatsApp Chat loaded."
);

</script>
