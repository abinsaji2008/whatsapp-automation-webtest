<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolution API - Send Image</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: #1c1c1c;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 40px #000;
    }

    h2 {
      margin-top: 0;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      margin-bottom: 15px;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #292929;
      color: white;
    }

    button {
      background: #25D366;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #20b957;
    }

    #preview {
      max-width: 100%;
      max-height: 250px;
      display: none;
      margin: 10px auto 20px;
      border-radius: 12px;
    }

    #status {
      padding: 12px;
      border-radius: 10px;
      background: #292929;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <a href="index.html">Home Page</a>

<div class="card">
  <h2>📷 Send WhatsApp Image</h2>

  <label>Evolution API URL</label>
  <input
    id="apiUrl"
    placeholder="https://your-server.com"
  >

  <label>Instance Name</label>
  <input
    id="instance"
    placeholder="my-instance"
  >

  <label>API Key</label>
  <input
    id="apiKey"
    type="password"
    placeholder="Your API Key"
  >

  <label>WhatsApp Number</label>
  <input
    id="number"
    placeholder="919876543210"
  >

  <label>Select Image</label>
  <input
    id="image"
    type="file"
    accept="image/*"
  >

  <img id="preview">

  <label>Caption</label>
  <textarea
    id="caption"
    placeholder="Enter caption..."
  ></textarea>

  <button onclick="sendImage()">
    🚀 Send Image
  </button>

  <div id="status">Ready</div>
</div>

<script>
async function sendImage() {

  const apiUrl = document.getElementById("apiUrl").value.trim();
  const instance = document.getElementById("instance").value.trim();
  const apiKey = document.getElementById("apiKey").value.trim();
  const number = document.getElementById("number").value.trim();
  const caption = document.getElementById("caption").value;
  const file = document.getElementById("image").files[0];

  if (!apiUrl || !instance || !apiKey || !number || !file) {
    alert("Please fill all required fields.");
    return;
  }

  const status = document.getElementById("status");

  status.textContent = "Converting image...";

  const base64 = await fileToBase64(file);

  const cleanBase64 = base64.split(",")[1];

  const endpoint =
    apiUrl.replace(/\/$/, "") +
    "/message/sendMedia/" +
    encodeURIComponent(instance);

  status.textContent = "Sending...";

  try {

    const response = await fetch(endpoint, {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": apiKey
      },

      body: JSON.stringify({
        number: number,
        mediatype: "image",
        mimetype: file.type,
        caption: caption,
        media: cleanBase64,
        fileName: file.name
      })
    });

    const data = await response.json();

    if (response.ok) {
      status.textContent =
        "✅ Image sent successfully!\n\n" +
        JSON.stringify(data, null, 2);
    } else {
      status.textContent =
        "❌ Error\n\n" +
        JSON.stringify(data, null, 2);
    }

  } catch (error) {

    status.textContent =
      "❌ Request failed:\n" + error.message;

  }
}


function fileToBase64(file) {
  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}


// Image preview
document.getElementById("image").addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  const preview = document.getElementById("preview");

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

});
</script>

</body>
</html>
